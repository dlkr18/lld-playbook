<!DOCTYPE html>
<!--
  GitHub Pages serves this for a REAL 404 — a mistyped /cheatsheets/*.html, a
  moved sheet, a stale external link. docsify's own notFoundPage/_404.md only
  covers hash routes inside the SPA and never sees these.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Interview Playbook</title>
  <link rel="icon" href="/lld-playbook/favicon.svg">
  <meta name="theme-color" content="#f7f8fa">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lld-playbook/theme.css">

  <script>
    (function(){try{if(localStorage.getItem("playbook-theme")==="dark")
      document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();
  </script>

  <style>
    .wrap { max-width: 640px; margin: 0 auto; padding: var(--s-9) var(--s-5); }
    .code {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted);
    }
    h1 { margin: var(--s-3) 0 var(--s-4); }
    .links { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-top: var(--s-6); }
    .links a {
      padding: 9px var(--s-5); border-radius: var(--r-sm);
      font-size: 14px; font-weight: 600;
      background: var(--surface-raised); color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .links a:first-child { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .links a:hover { text-decoration: none; border-color: var(--border-strong); }
    .links a:first-child:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .path {
      margin-top: var(--s-6); padding: var(--s-3) var(--s-4);
      background: var(--surface-code); border: 1px solid var(--border-subtle);
      border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 13px;
      color: var(--text-muted); overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>That page isn&rsquo;t here.</h1>
    <p>It moved, or the link was mistyped. The four pillars are all one click away.</p>

    <div class="links">
      <a href="/lld-playbook/">Home</a>
      <a href="/lld-playbook/cheatsheets/index.html">Cheat sheets</a>
      <a href="/lld-playbook/#/problems/CATALOG">Problem catalog</a>
      <a href="/lld-playbook/#/PLAN">4-week plan</a>
    </div>

    <div class="path" id="requested"></div>
  </div>

  <script>
    document.getElementById('requested').textContent = 'requested: ' + location.pathname;
  </script>
</body>
</html>
