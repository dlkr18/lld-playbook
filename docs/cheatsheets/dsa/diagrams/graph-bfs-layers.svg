<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Breadth-first search layers</title><desc id="desc">Starting at A, BFS visits B and C at distance one, then D and E at distance two.</desc>
  <rect width="760" height="240" rx="12" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#64748b"><text x="120" y="30">DISTANCE 0</text><text x="380" y="30">DISTANCE 1</text><text x="640" y="30">DISTANCE 2</text></g>
  <path d="M158 116 345 72 M158 124 345 168 M414 69 605 69 M414 171 605 171" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="120" cy="120" r="38" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="120" y="128" fill="#1e3a8a">A</text>
    <circle cx="380" cy="68" r="34" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="380" y="76" fill="#166534">B</text>
    <circle cx="380" cy="172" r="34" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="380" y="180" fill="#166534">C</text>
    <circle cx="640" cy="68" r="34" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="640" y="76" fill="#9a3412">D</text>
    <circle cx="640" cy="172" r="34" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="640" y="180" fill="#9a3412">E</text>
  </g>
  <text x="380" y="226" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Queue order: A → B, C → D, E</text>
</svg>
