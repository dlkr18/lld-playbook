<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Depth-first search path</title><desc id="desc">DFS visits A, B, D, backtracks to A, then visits C and E.</desc>
  <rect width="760" height="240" rx="12" fill="#f8fafc"/>
  <path d="M145 108 265 68 M335 60 505 60 M145 132 265 172 M335 180 505 180" fill="none" stroke="#1d4ed8" stroke-width="4"/>
  <path d="M505 77 336 77 148 140" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="8 6"/>
  <g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="110" cy="120" r="36" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="110" y="128" fill="#1e3a8a">A</text>
    <circle cx="300" cy="60" r="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="300" y="68" fill="#1e3a8a">B</text>
    <circle cx="540" cy="60" r="34" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="540" y="68" fill="#166534">D</text>
    <circle cx="300" cy="180" r="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="300" y="188" fill="#1e3a8a">C</text>
    <circle cx="540" cy="180" r="34" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="540" y="188" fill="#166534">E</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#475569"><text x="590" y="57">1 A → 2 B → 3 D</text><text x="590" y="83" fill="#c2410c">↶ backtrack</text><text x="590" y="109">4 C → 5 E</text></g>
  <text x="380" y="226" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Blue = descent · dashed orange = return · green = leaf</text>
</svg>
