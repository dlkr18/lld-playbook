<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Dijkstra shortest route</title><desc id="desc">A to B costs two, B to C one, and C to D three; the highlighted route totals six.</desc>
  <rect width="760" height="240" rx="12" fill="#f8fafc"/>
  <path d="M139 120 431 120 M318 58 632 58" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M130 103 250 65 M310 68 440 106 M500 106 635 67" fill="none" stroke="#1d4ed8" stroke-width="5"/>
  <g font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#475569"><text x="197" y="75">2</text><text x="365" y="76">1</text><text x="566" y="75">3</text><text x="285" y="142">5</text><text x="472" y="46">7</text></g>
  <g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="105" cy="120" r="35" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="105" y="128" fill="#1e3a8a">A</text>
    <circle cx="280" cy="58" r="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="280" y="66" fill="#1e3a8a">B</text>
    <circle cx="470" cy="120" r="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="470" y="128" fill="#1e3a8a">C</text>
    <circle cx="665" cy="58" r="34" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="665" y="66" fill="#166534">D</text>
  </g>
  <text x="380" y="203" fill="#1e3a8a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Shortest A → B → C → D: 2 + 1 + 3 = 6</text>
  <text x="380" y="226" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">Pale edges are alternatives; all weights are non-negative.</text>
</svg>
