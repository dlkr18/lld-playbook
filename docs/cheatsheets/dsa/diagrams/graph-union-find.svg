<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Union-Find components</title><desc id="desc">The components A B C and D E become one component after union C D.</desc>
  <rect width="760" height="240" rx="12" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b"><text x="28" y="38">BEFORE</text><text x="28" y="152">AFTER union(C, D)</text></g>
  <rect x="125" y="16" width="250" height="90" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><rect x="425" y="16" width="210" height="90" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="125" y="128" width="510" height="95" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <g fill="#fff" stroke="#1d4ed8" stroke-width="2"><circle cx="180" cy="62" r="23"/><circle cx="250" cy="62" r="23"/><circle cx="320" cy="62" r="23"/></g>
    <g fill="#fff" stroke="#15803d" stroke-width="2"><circle cx="480" cy="62" r="23"/><circle cx="550" cy="62" r="23"/><circle cx="195" cy="176" r="23"/><circle cx="280" cy="176" r="23"/><circle cx="365" cy="176" r="23"/><circle cx="470" cy="176" r="23"/><circle cx="555" cy="176" r="23"/></g>
    <g fill="#0f172a"><text x="180" y="69">A</text><text x="250" y="69">B</text><text x="320" y="69">C</text><text x="480" y="69">D</text><text x="550" y="69">E</text><text x="195" y="183">A</text><text x="280" y="183">B</text><text x="365" y="183">C</text><text x="470" y="183">D</text><text x="555" y="183">E</text></g>
  </g>
  <path d="M375 175 458 175" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="6 5"/>
</svg>
