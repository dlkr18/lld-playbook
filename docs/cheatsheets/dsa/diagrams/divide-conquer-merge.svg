<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Merge sort recursion tree</title><desc id="desc">Four one three two splits into two halves, then singletons. Merging upward produces one two three four.</desc>
  <rect width="760" height="240" rx="12" fill="#f8fafc"/>
  <g fill="none" stroke="#94a3b8" stroke-width="2.5"><path d="M380 50 230 100 M380 50 530 100 M230 132 135 178 M230 132 325 178 M530 132 435 178 M530 132 625 178"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="700">
    <rect x="306" y="15" width="148" height="38" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="380" y="41" fill="#1e3a8a" font-size="17">[4, 1, 3, 2]</text>
    <rect x="168" y="99" width="124" height="36" rx="10" fill="#fff" stroke="#64748b"/><text x="230" y="124" fill="#334155" font-size="16">[4, 1]</text>
    <rect x="468" y="99" width="124" height="36" rx="10" fill="#fff" stroke="#64748b"/><text x="530" y="124" fill="#334155" font-size="16">[3, 2]</text>
    <rect x="99" y="177" width="72" height="36" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="135" y="202" fill="#166534" font-size="16">[4]</text>
    <rect x="289" y="177" width="72" height="36" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="325" y="202" fill="#166534" font-size="16">[1]</text>
    <rect x="399" y="177" width="72" height="36" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="435" y="202" fill="#166534" font-size="16">[3]</text>
    <rect x="589" y="177" width="72" height="36" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="625" y="202" fill="#166534" font-size="16">[2]</text>
  </g>
  <text x="380" y="233" fill="#166534" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">Merge upward → [1, 4] + [2, 3] → [1, 2, 3, 4]</text>
</svg>
