<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1210" viewBox="0 0 2140 1210">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#111"/></marker>
    <marker id="ahb" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aho" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="ahg" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="ahp" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker>
    <marker id="ahv" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker>
    <marker id="ahr" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="trig" markerWidth="17" markerHeight="15" refX="15" refY="7.5" orient="auto"><path d="M1,1 L15,7.5 L1,14 z" fill="#fff" stroke="#16a34a" stroke-width="2"/></marker>
  </defs>

  <rect width="2140" height="1210" fill="#ffffff"/>

  <!-- TITLE -->
  <text x="1070" y="52" font-family="Marker Felt" font-size="46" fill="#1e40af" text-anchor="middle" font-weight="bold">CRICINFO — MATCH LIFECYCLE &amp; SCORING PATH</text>
  <path d="M520,68 Q1070,84 1620,66" stroke="#1e40af" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- 1: THE LIFECYCLE -->
  <circle cx="80" cy="112" r="14" fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <text x="80" y="119" font-family="Chalkboard SE" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold">1</text>
  <text x="108" y="119" font-family="Marker Felt" font-size="20" fill="#2563eb" font-weight="bold">MatchStatus — the guard that makes every method safe</text>

  <circle cx="52" cy="230" r="11" fill="#111"/>
  <path d="M63,230 L88,230" stroke="#111" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>

  <!-- SCHEDULED -->
  <rect x="96" y="176" width="300" height="112" rx="16" fill="none" stroke="#7e22ce" stroke-width="3.6"/>
  <text x="246" y="210" font-family="Chalkboard SE" font-size="20" fill="#7e22ce" text-anchor="middle" font-weight="bold">SCHEDULED</text>
  <path d="M112,222 L380,222" stroke="#7e22ce" stroke-width="1.6"/>
  <text x="246" y="246" font-family="Chalkboard SE" font-size="12.5" fill="#111" text-anchor="middle">set by the Match constructor</text>
  <text x="246" y="268" font-family="Chalkboard SE" font-size="12.5" fill="#111" text-anchor="middle">scores are 0, winner is null</text>

  <path d="M396,232 L500,232" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ahg)"/>
  <text x="448" y="220" font-family="Chalkboard SE" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">startMatch()</text>
  <text x="448" y="256" font-family="Chalkboard SE" font-size="11.5" fill="#6b7280" text-anchor="middle">only from SCHEDULED</text>

  <!-- IN_PROGRESS -->
  <rect x="506" y="176" width="300" height="112" rx="16" fill="none" stroke="#15803d" stroke-width="3.6"/>
  <text x="656" y="210" font-family="Chalkboard SE" font-size="20" fill="#15803d" text-anchor="middle" font-weight="bold">IN_PROGRESS</text>
  <path d="M522,222 L790,222" stroke="#15803d" stroke-width="1.6"/>
  <text x="656" y="246" font-family="Chalkboard SE" font-size="12.5" fill="#111" text-anchor="middle">the ONLY state that accepts</text>
  <text x="656" y="268" font-family="Chalkboard SE" font-size="12.5" fill="#111" text-anchor="middle">updateScore()</text>

  <path d="M806,232 L910,232" stroke="#db2777" stroke-width="3" fill="none" marker-end="url(#ahp)"/>
  <text x="858" y="220" font-family="Chalkboard SE" font-size="14" fill="#db2777" text-anchor="middle" font-weight="bold">endMatch(winnerId)</text>
  <text x="858" y="256" font-family="Chalkboard SE" font-size="11.5" fill="#6b7280" text-anchor="middle">winner must resolve</text>

  <!-- COMPLETED -->
  <rect x="916" y="176" width="300" height="112" rx="16" fill="none" stroke="#db2777" stroke-width="3.6"/>
  <text x="1066" y="210" font-family="Chalkboard SE" font-size="20" fill="#db2777" text-anchor="middle" font-weight="bold">COMPLETED</text>
  <path d="M932,222 L1200,222" stroke="#db2777" stroke-width="1.6"/>
  <text x="1066" y="246" font-family="Chalkboard SE" font-size="12.5" fill="#111" text-anchor="middle">winner set &#183; W/L recorded on both</text>
  <text x="1066" y="268" font-family="Chalkboard SE" font-size="12.5" fill="#6b7280" text-anchor="middle">terminal — nothing reopens a match</text>

  <path d="M1216,232 L1258,232" stroke="#111" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>
  <circle cx="1288" cy="232" r="14" fill="none" stroke="#111" stroke-width="2.6"/>
  <circle cx="1288" cy="232" r="8" fill="#111"/>

  <!-- self loop score -->
  <path d="M586,176 Q586,128 656,128 Q726,128 726,176" stroke="#15803d" stroke-width="2.6" fill="none" marker-end="url(#ahg)"/>
  <text x="656" y="120" font-family="Chalkboard SE" font-size="13" fill="#15803d" text-anchor="middle">updateScore(matchId, teamId, runs) — any number of times</text>

  <!-- CANCELLED, unreachable -->
  <rect x="1360" y="176" width="330" height="112" rx="16" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9,7"/>
  <text x="1525" y="210" font-family="Chalkboard SE" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="bold">CANCELLED</text>
  <path d="M1376,222 L1674,222" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="1525" y="246" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="bold">DECLARED IN THE ENUM,</text>
  <text x="1525" y="268" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="bold">NEVER ASSIGNED — no cancel()</text>
  <path d="M1216,264 L1300,300 L1440,300 L1440,292" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" fill="none" marker-end="url(#ahr)"/>
  <text x="1310" y="322" font-family="Chalkboard SE" font-size="12" fill="#dc2626">no edge exists in either direction</text>

  <!-- rejection notes -->
  <rect x="96" y="340" width="1594" height="122" rx="12" fill="none" stroke="#6b7280" stroke-width="2.6"/>
  <text x="116" y="368" font-family="Chalkboard SE" font-size="15" fill="#111" font-weight="bold">WHAT EACH ILLEGAL CALL DOES — every service mutator runs the same two-step guard:</text>
  <text x="116" y="396" font-family="Chalkboard SE" font-size="13.5" fill="#111">&#9312; look the entity up in its ConcurrentHashMap &#8594; null ⇒ <tspan fill="#dc2626" font-weight="bold">IllegalArgumentException("Match not found: id")</tspan></text>
  <text x="116" y="420" font-family="Chalkboard SE" font-size="13.5" fill="#111">&#9313; compare status to the one it requires &#8594; mismatch ⇒ <tspan fill="#dc2626" font-weight="bold">IllegalStateException("Cannot start match -- current status: COMPLETED")</tspan></text>
  <text x="116" y="448" font-family="Chalkboard SE" font-size="12.5" fill="#15803d" font-weight="bold">The split matters: a bad id is the CALLER's mistake (argument), a bad phase is the SYSTEM's state (state). Different exception, different fix. ✓</text>

  <!-- 2: THE SCORE PATH -->
  <circle cx="80" cy="500" r="14" fill="none" stroke="#ea580c" stroke-width="2.6"/>
  <text x="80" y="507" font-family="Chalkboard SE" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="bold">2</text>
  <text x="108" y="507" font-family="Marker Felt" font-size="20" fill="#ea580c" font-weight="bold">THE SCORING PATH — and why setScore is the weak link</text>

  <rect x="62" y="522" width="1010" height="316" rx="14" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="14,9"/>

  <rect x="88" y="548" width="290" height="56" rx="9" fill="none" stroke="#7e22ce" stroke-width="2.8"/>
  <text x="102" y="572" font-family="Chalkboard SE" font-size="14" fill="#7e22ce" font-weight="bold">Cricinfo.updateScore(...)</text>
  <text x="102" y="592" font-family="Chalkboard SE" font-size="12" fill="#dc2626">instanceof downcast — no-ops on a mock</text>
  <path d="M378,576 L418,576" stroke="#111" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>

  <rect x="424" y="548" width="290" height="56" rx="9" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="438" y="572" font-family="Chalkboard SE" font-size="14" fill="#2563eb" font-weight="bold">Impl.updateScore(m, t, runs)</text>
  <text x="438" y="592" font-family="Chalkboard SE" font-size="12" fill="#111">lookup match &#183; require IN_PROGRESS &#183; lookup team</text>
  <path d="M714,576 L754,576" stroke="#111" stroke-width="2.6" fill="none" marker-end="url(#ah)"/>

  <rect x="760" y="548" width="290" height="56" rx="9" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="774" y="572" font-family="Chalkboard SE" font-size="14" fill="#ea580c" font-weight="bold">match.setScore(team, runs)</text>
  <text x="774" y="592" font-family="Chalkboard SE" font-size="12" fill="#111">team == team1 ? team1Score = runs : ...</text>

  <path d="M905,604 L905,632" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#ahr)"/>

  <rect x="88" y="632" width="962" height="190" rx="10" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="569" y="660" font-family="Chalkboard SE" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">THREE THINGS WRONG WITH setScore — name them before you are asked</text>
  <path d="M102,672 L1036,672" stroke="#dc2626" stroke-width="1.6"/>
  <text x="108" y="698" font-family="Chalkboard SE" font-size="13.5" fill="#111"><tspan font-weight="bold">1. It sets an ABSOLUTE total, not a delta.</tspan> The parameter is called `runs` but means "score so far". A caller that</text>
  <text x="126" y="719" font-family="Chalkboard SE" font-size="13.5" fill="#111">passes 4 for a boundary wipes the innings back to 4. Every client has to read-modify-write, off the lock.</text>
  <text x="108" y="746" font-family="Chalkboard SE" font-size="13.5" fill="#111"><tspan font-weight="bold">2. It matches teams by reference identity</tspan> (team == team1). Hand it any other Team and it silently does nothing —</text>
  <text x="126" y="767" font-family="Chalkboard SE" font-size="13.5" fill="#111">no exception, no log. An if / else-if with no final else is where bugs go to hide.</text>
  <text x="108" y="794" font-family="Chalkboard SE" font-size="13.5" fill="#111"><tspan font-weight="bold">3. It is not on the service interface,</tspan> so the one method that changes a live score is the one method a</text>
  <text x="126" y="815" font-family="Chalkboard SE" font-size="13.5" fill="#111">substitute implementation cannot provide. The seam has a hole in exactly the wrong place.</text>

  <!-- 3: RACE -->
  <circle cx="1110" cy="500" r="14" fill="none" stroke="#dc2626" stroke-width="2.6"/>
  <text x="1110" y="507" font-family="Chalkboard SE" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">3</text>
  <text x="1138" y="507" font-family="Marker Felt" font-size="20" fill="#dc2626" font-weight="bold">THE RACE THE CHM DOES NOT FIX</text>

  <rect x="1092" y="522" width="998" height="316" rx="14" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="14,9"/>

  <text x="1116" y="552" font-family="Chalkboard SE" font-size="14" fill="#111">Two scorers call endMatch() on the same live match at the same instant:</text>

  <!-- lanes -->
  <text x="1130" y="588" font-family="Chalkboard SE" font-size="14" fill="#2563eb" font-weight="bold">THREAD A</text>
  <text x="1620" y="588" font-family="Chalkboard SE" font-size="14" fill="#ea580c" font-weight="bold">THREAD B</text>
  <path d="M1116,598 L1560,598" stroke="#2563eb" stroke-width="1.4"/>
  <path d="M1606,598 L2060,598" stroke="#ea580c" stroke-width="1.4"/>

  <rect x="1116" y="612" width="444" height="40" rx="7" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <text x="1130" y="638" font-family="Chalkboard SE" font-size="13" fill="#111">matches.get(id) &#8594; the Match &#183; status == IN_PROGRESS ✓</text>

  <rect x="1606" y="662" width="454" height="40" rx="7" fill="none" stroke="#ea580c" stroke-width="2.4"/>
  <text x="1620" y="688" font-family="Chalkboard SE" font-size="13" fill="#111">matches.get(id) &#8594; same Match &#183; status STILL IN_PROGRESS ✓</text>

  <rect x="1116" y="712" width="444" height="40" rx="7" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <text x="1130" y="738" font-family="Chalkboard SE" font-size="13" fill="#111">match.end(India) &#8594; COMPLETED &#183; India.recordWin()</text>

  <rect x="1606" y="762" width="454" height="40" rx="7" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <text x="1620" y="788" font-family="Chalkboard SE" font-size="13" fill="#dc2626" font-weight="bold">match.end(Australia) &#8594; overwrites winner, DOUBLE-counts W/L</text>

  <path d="M1338,652 L1338,708" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#ahb)"/>
  <path d="M1833,702 L1833,758" stroke="#ea580c" stroke-width="2.2" fill="none" marker-end="url(#aho)"/>
  <path d="M1560,632 L1600,672" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,4" fill="none"/>

  <text x="1116" y="778" font-family="Chalkboard SE" font-size="12.5" fill="#111">The CHM made the LOOKUP</text>
  <text x="1116" y="796" font-family="Chalkboard SE" font-size="12.5" fill="#111">atomic. It did nothing for the</text>
  <text x="1116" y="814" font-family="Chalkboard SE" font-size="12.5" fill="#111">check-then-act that follows.</text>

  <text x="1116" y="830" font-family="Chalkboard SE" font-size="12.5" fill="#15803d" font-weight="bold">Fix: synchronized (match) around read+mutate, or move the guard INTO Match.end() and make status a CAS. ✓</text>

  <!-- STICKY A -->
  <g transform="rotate(-1.5 420 950)">
    <rect x="70" y="866" width="700" height="182" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" rx="4"/>
    <text x="92" y="898" font-family="Chalkboard SE" font-size="15" fill="#7f1d1d" font-weight="bold">THE MISSING FOURTH STATE</text>
    <text x="92" y="928" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">Real cricket does not end with a winner every time. Draws, ties, no-results and</text>
    <text x="92" y="951" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">abandonments are all normal outcomes — and end(Team winner) cannot express any</text>
    <text x="92" y="974" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">of them, because it dereferences the winner to record W/L on both sides.</text>
    <text x="92" y="1004" font-family="Chalkboard SE" font-size="13" fill="#92710c">Minimum fix: a Result value object (WIN(team) | TIE | DRAW | NO_RESULT) passed to</text>
    <text x="92" y="1026" font-family="Chalkboard SE" font-size="13" fill="#92710c">end(), and CANCELLED wired to an actual cancel() from SCHEDULED or IN_PROGRESS.</text>
  </g>
  <circle cx="420" cy="870" r="7" fill="#dc2626"/>

  <!-- STICKY B -->
  <g transform="rotate(1.5 1120 950)">
    <rect x="800" y="866" width="640" height="182" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" rx="4"/>
    <text x="822" y="898" font-family="Chalkboard SE" font-size="15" fill="#7f1d1d" font-weight="bold">WHERE SHOULD THE GUARD LIVE?</text>
    <text x="822" y="928" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">Today the status checks sit in the SERVICE and the mutations sit on the</text>
    <text x="822" y="951" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">MATCH. That split is why getMatch() is dangerous: it hands out the live</text>
    <text x="822" y="974" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">object, and match.start() has no guard of its own.</text>
    <text x="822" y="1004" font-family="Chalkboard SE" font-size="13" fill="#92710c">Push the guard into the aggregate: Match.start() throws if it is not</text>
    <text x="822" y="1026" font-family="Chalkboard SE" font-size="13" fill="#92710c">SCHEDULED. Then the invariant holds no matter who holds the reference.</text>
  </g>
  <circle cx="1120" cy="870" r="7" fill="#dc2626"/>

  <!-- STICKY C -->
  <g transform="rotate(-1 1770 950)">
    <rect x="1470" y="866" width="620" height="182" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" rx="4"/>
    <text x="1492" y="898" font-family="Chalkboard SE" font-size="15" fill="#7f1d1d" font-weight="bold">READ-HEAVY IS THE WHOLE POINT</text>
    <text x="1492" y="928" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">A live-score system is millions of readers and one scorer. That shape</text>
    <text x="1492" y="951" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">justifies the CHM choice and rules out a global lock on reads.</text>
    <text x="1492" y="974" font-family="Chalkboard SE" font-size="13.5" fill="#713f12">Serialise only the WRITES — per match, not globally.</text>
    <text x="1492" y="1004" font-family="Chalkboard SE" font-size="13" fill="#92710c">One lock per Match means India-vs-Australia and England-vs-NZ never</text>
    <text x="1492" y="1026" font-family="Chalkboard SE" font-size="13" fill="#92710c">contend. Lock granularity IS the design answer here.</text>
  </g>
  <circle cx="1770" cy="870" r="7" fill="#dc2626"/>

  <!-- WHITEBOARD ORDER -->
  <text x="60" y="1090" font-family="Marker Felt" font-size="19" fill="#1e40af" font-weight="bold">WHITEBOARD ORDER:</text>
  <text x="272" y="1090" font-family="Chalkboard SE" font-size="15.5" fill="#111">&#9312; SCHEDULED &#8594; IN_PROGRESS &#8594; COMPLETED with the self-loop for scoring &#8594; &#9313; the two-step guard (lookup, then status) &#8594; &#9314; trace updateScore end to end &#8594; &#9315; the endMatch race and the per-Match lock that fixes it</text>

  <!-- LEGEND -->
  <rect x="50" y="1110" width="2040" height="80" rx="14" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-dasharray="10,8"/>
  <g font-family="Chalkboard SE" font-size="13.5" fill="#111">
    <text x="80" y="1158" font-family="Marker Felt" font-size="20" fill="#1e40af" font-weight="bold">LEGEND</text>
    <rect x="200" y="1140" width="30" height="22" rx="7" fill="none" stroke="#15803d" stroke-width="3"/>
    <text x="240" y="1157">live state</text>
    <rect x="360" y="1140" width="30" height="22" rx="7" fill="none" stroke="#db2777" stroke-width="3"/>
    <text x="400" y="1157">terminal state</text>
    <rect x="540" y="1140" width="30" height="22" rx="7" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="6,5"/>
    <text x="580" y="1157">unreachable state</text>
    <path d="M760,1151 L820,1151" stroke="#111" stroke-width="2.8" fill="none" marker-end="url(#ah)"/>
    <text x="832" y="1157">transition / call step</text>
    <path d="M1010,1151 L1070,1151" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7,5" fill="none" marker-end="url(#ahr)"/>
    <text x="1082" y="1157">edge that does not exist</text>
    <rect x="1300" y="1140" width="22" height="22" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>
    <text x="1334" y="1157">interview insight</text>
    <circle cx="1512" cy="1151" r="10" fill="#111"/>
    <text x="1534" y="1157">start / terminal</text>
    <text x="1700" y="1157" fill="#6b7280">Lookup-then-status guards &#183; CHM per registry &#183; write race is real &#8212; LLD</text>
  </g>
</svg>
