<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1210" viewBox="0 0 2140 1210">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#111"/></marker>
    <marker id="ahb" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aho" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="ahg" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="ahp" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker>
    <marker id="ahv" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker>
    <marker id="ahr" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="trib" markerWidth="17" markerHeight="15" refX="15" refY="7.5" orient="auto"><path d="M1,1 L15,7.5 L1,14 z" fill="#fff" stroke="#2563eb" stroke-width="2"/></marker>
    <marker id="trig" markerWidth="17" markerHeight="15" refX="15" refY="7.5" orient="auto"><path d="M1,1 L15,7.5 L1,14 z" fill="#fff" stroke="#16a34a" stroke-width="2"/></marker>
    <marker id="trio" markerWidth="17" markerHeight="15" refX="15" refY="7.5" orient="auto"><path d="M1,1 L15,7.5 L1,14 z" fill="#fff" stroke="#ea580c" stroke-width="2"/></marker>
  </defs>

  <rect width="2140" height="1210" fill="#ffffff"/>

  <text x="1070" y="52" font-family="Marker Felt" font-size="46" fill="#1e40af" text-anchor="middle" font-weight="bold">SEARCH ENGINE — THE TWO PIPELINES, SIDE BY SIDE</text>
  <path d="M420,68 Q1070,88 1720,66" stroke="#1e40af" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- ══════════ LEFT: WRITE PATH ══════════ -->
  <circle cx="80" cy="112" r="14" fill="none" stroke="#ea580c" stroke-width="2.6"/>
  <text x="80" y="119" font-family="Chalkboard SE" font-size="16" fill="#ea580c" text-anchor="middle" font-weight="bold">1</text>
  <text x="108" y="119" font-family="Marker Felt" font-size="21" fill="#ea580c" font-weight="bold">THE WRITE PATH — index(Document), under the WRITE lock</text>

  <rect x="62" y="134" width="960" height="80" rx="10" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="80" y="162" font-family="Chalkboard SE" font-size="15" fill="#111" font-weight="bold">D7 &#183; title "Searching Java Patterns" &#183; content "The best patterns for searching in Java"</text>
  <text x="80" y="190" font-family="Chalkboard SE" font-size="13" fill="#6b7280">raw text, mixed case, punctuation, stop-words, inflected forms &#8212; nothing about it is queryable yet</text>

  <path d="M542,214 L542,240" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#aho)"/>

  <rect x="62" y="244" width="960" height="86" rx="10" fill="none" stroke="#ea580c" stroke-width="2.8"/>
  <text x="80" y="272" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">1. toLowerCase() &#183; split("\W+")</text>
  <text x="80" y="298" font-family="Chalkboard SE" font-size="13.5" fill="#111">[ searching, java, patterns, the, best, patterns, for, searching, in, java ]</text>
  <text x="80" y="320" font-family="Chalkboard SE" font-size="12.5" fill="#6b7280">10 raw tokens &#8212; title and content are analysed with the SAME chain</text>

  <path d="M542,330 L542,352" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#aho)"/>

  <rect x="62" y="356" width="960" height="86" rx="10" fill="none" stroke="#ea580c" stroke-width="2.8"/>
  <text x="80" y="384" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">2. drop STOP_WORDS = { the, a, an, is, in, of, and, to }</text>
  <text x="80" y="410" font-family="Chalkboard SE" font-size="13.5" fill="#111">[ searching, java, patterns, best, patterns, searching, java ]&#160;&#160;&#160;<tspan fill="#dc2626">&#8722; "the", &#8722; "in"</tspan></text>
  <text x="80" y="432" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" font-weight="bold">"for" and "best" survive &#8212; an 8-word stop list is a toy; real ones are language-specific and tuned</text>

  <path d="M542,442 L542,464" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#aho)"/>

  <rect x="62" y="468" width="960" height="98" rx="10" fill="none" stroke="#ea580c" stroke-width="2.8"/>
  <text x="80" y="496" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">3. stem() &#8212; StemmingTokenizer wraps the simple one</text>
  <text x="80" y="522" font-family="Chalkboard SE" font-size="13.5" fill="#111">searching &#8594; <tspan fill="#15803d" font-weight="bold">search</tspan>&#160;&#160;&#183;&#160;&#160;patterns &#8594; <tspan fill="#15803d" font-weight="bold">pattern</tspan>&#160;&#160;&#183;&#160;&#160;java &#8594; java&#160;&#160;&#183;&#160;&#160;best &#8594; best</text>
  <text x="80" y="546" font-family="Chalkboard SE" font-size="13" fill="#111">[ search, java, pattern, best, pattern, search, java ]</text>
  <text x="80" y="562" font-family="Chalkboard SE" font-size="12" fill="#dc2626" font-weight="bold">suffix-chopping, not Porter: it also turns "running" into "runn" and "bus" into "bu"</text>

  <path d="M542,566 L542,588" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#aho)"/>

  <rect x="62" y="592" width="960" height="86" rx="10" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="80" y="620" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">4. count into term frequencies</text>
  <text x="80" y="646" font-family="Chalkboard SE" font-size="13.5" fill="#111">{ search: 2, java: 2, pattern: 2, best: 1 }&#160;&#160;&#160;&#160;docLength = 7</text>
  <text x="80" y="668" font-family="Chalkboard SE" font-size="12.5" fill="#15803d" font-weight="bold">docLength is stored now so scoring never has to re-tokenize the document &#10003;</text>

  <path d="M542,678 L542,700" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#ahb)"/>

  <rect x="62" y="704" width="960" height="140" rx="10" fill="none" stroke="#2563eb" stroke-width="3.2"/>
  <text x="80" y="732" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">5. commit to the index &#8212; ONE write lock, THREE maps</text>
  <text x="80" y="758" font-family="Chalkboard SE" font-size="13.5" fill="#111">invertedIndex["search"].add(D7, tf=2)&#160;&#160;&#183;&#160;&#160;["java"].add(D7, tf=2)&#160;&#160;&#183;&#160;&#160;["pattern"].add(D7, tf=2)&#160;&#160;&#183;&#160;&#160;["best"].add(D7, tf=1)</text>
  <text x="80" y="782" font-family="Chalkboard SE" font-size="13.5" fill="#111">documents[D7] = doc&#160;&#160;&#160;&#160;docLengths[D7] = 7</text>
  <text x="80" y="806" font-family="Chalkboard SE" font-size="12.5" fill="#15803d" font-weight="bold">update() = remove-then-index inside the SAME lock &#8658; a searcher never sees the half-removed doc &#10003;</text>
  <text x="80" y="830" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" font-weight="bold">the three maps have no shared invariant object &#8212; the lock is the only thing keeping them consistent</text>

  <path d="M542,844 L542,866" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ahg)"/>

  <rect x="62" y="870" width="960" height="112" rx="10" fill="none" stroke="#15803d" stroke-width="3"/>
  <text x="80" y="898" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">6. notifyObservers(DOCUMENT_ADDED, "D7")</text>
  <text x="80" y="924" font-family="Chalkboard SE" font-size="13.5" fill="#111">CacheInvalidationObserver drops cached pages &#183; AnalyticsObserver counts &#183; ReplicationObserver ships</text>
  <text x="80" y="948" font-family="Chalkboard SE" font-size="12.5" fill="#15803d" font-weight="bold">the index knows nothing about caches or replicas &#8212; it publishes an event and forgets &#10003;</text>
  <text x="80" y="972" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" font-weight="bold">fired synchronously while the write lock is held: one slow observer blocks every writer AND every reader</text>

  <!-- ══════════ RIGHT: READ PATH ══════════ -->
  <circle cx="1098" cy="112" r="14" fill="none" stroke="#7e22ce" stroke-width="2.6"/>
  <text x="1098" y="119" font-family="Chalkboard SE" font-size="16" fill="#7e22ce" text-anchor="middle" font-weight="bold">2</text>
  <text x="1126" y="119" font-family="Marker Felt" font-size="21" fill="#7e22ce" font-weight="bold">THE READ PATH — search(SearchQuery), under the READ lock</text>

  <rect x="1080" y="134" width="1008" height="106" rx="10" fill="none" stroke="#7e22ce" stroke-width="3"/>
  <text x="1098" y="162" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">new SearchQuery.Builder()</text>
  <text x="1098" y="188" font-family="Chalkboard SE" font-size="14" fill="#111">&#160;&#160;.query(<tspan fill="#db2777" font-weight="bold">"searching patern"</tspan>).operator(AND).fuzzy(true).field(ALL).page(0, 10).build()</text>
  <text x="1098" y="214" font-family="Chalkboard SE" font-size="12.5" fill="#15803d" font-weight="bold">immutable once built &#8658; safe to log, cache by, or replay &#10003;&#160;&#160;&#160;note the deliberate typo in "patern"</text>
  <text x="1098" y="234" font-family="Chalkboard SE" font-size="12.5" fill="#6b7280">six optional knobs: raw query, operator, field, filters, fuzzy, offset+limit</text>

  <path d="M1584,240 L1584,262" stroke="#7e22ce" stroke-width="3" fill="none" marker-end="url(#ahv)"/>

  <rect x="1080" y="266" width="1008" height="86" rx="10" fill="none" stroke="#7e22ce" stroke-width="2.8"/>
  <text x="1098" y="294" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">1. tokenizer.tokenize(rawQuery) &#8212; THE SAME instance the writer used</text>
  <text x="1098" y="320" font-family="Chalkboard SE" font-size="13.5" fill="#111">[ <tspan font-weight="bold">search</tspan>, <tspan font-weight="bold">patern</tspan> ]&#160;&#160;&#160;&#160;<tspan fill="#6b7280">"searching" stemmed to "search"; "patern" has no known suffix, so it survives intact</tspan></text>
  <text x="1098" y="342" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" font-weight="bold">use a different tokenizer here and NOTHING matches &#8212; this symmetry is the most common bug in the design</text>

  <path d="M1584,352 L1584,374" stroke="#7e22ce" stroke-width="3" fill="none" marker-end="url(#ahv)"/>

  <rect x="1080" y="378" width="1008" height="112" rx="10" fill="none" stroke="#db2777" stroke-width="3"/>
  <text x="1098" y="406" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">2. fuzzyExpand("patern", maxDist = 2) &#8212; only because .fuzzy(true)</text>
  <text x="1098" y="432" font-family="Chalkboard SE" font-size="13.5" fill="#111">levenshtein("patern", "pattern") = 1 &#8804; 2&#160;&#160;&#8658;&#160;&#160;terms become [ search, patern, <tspan fill="#15803d" font-weight="bold">pattern</tspan> ]</text>
  <text x="1098" y="458" font-family="Chalkboard SE" font-size="13" fill="#111">DP table is O(|a|&#215;|b|) per comparison &#8212; and it is run against EVERY term in the vocabulary</text>
  <text x="1098" y="482" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" font-weight="bold">O(V &#183; |t|&#178;) per query term. At 1M terms this is the slowest thing on the page. Real fix: n-gram or BK-tree index.</text>

  <path d="M1584,490 L1584,512" stroke="#db2777" stroke-width="3" fill="none" marker-end="url(#ahp)"/>

  <rect x="1080" y="516" width="1008" height="164" rx="10" fill="none" stroke="#2563eb" stroke-width="3.2"/>
  <text x="1098" y="544" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">3. findCandidates &#8212; pure set algebra over the posting lists</text>
  <text x="1098" y="570" font-family="Chalkboard SE" font-size="13.5" fill="#111">postings["search"]&#160;&#160;= { D2, D7, D9 }&#160;&#160;&#160;&#160;<tspan fill="#6b7280">|3|</tspan></text>
  <text x="1098" y="594" font-family="Chalkboard SE" font-size="13.5" fill="#111">postings["pattern"] = { D7, D9 }&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#6b7280">|2|&#160;&#8592; smallest, so AND starts here</tspan></text>
  <text x="1098" y="618" font-family="Chalkboard SE" font-size="13.5" fill="#111">postings["patern"]&#160;&#160;= { } &#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#6b7280">|0| &#8212; the typo itself indexes nothing</tspan></text>
  <text x="1098" y="646" font-family="Chalkboard SE" font-size="14" fill="#15803d" font-weight="bold">AND &#8658; retainAll, smallest first&#160;&#8658;&#160;{ D7, D9 }&#160;&#160;&#160;&#160;&#160;&#160;OR &#8658; addAll &#8658; { D2, D7, D9 }</text>
  <text x="1098" y="670" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" font-weight="bold">strict AND with an empty list would return nothing &#8212; fuzzy terms must be OR-ed INTO their original term, not AND-ed</text>

  <path d="M1584,680 L1584,702" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#ahb)"/>

  <rect x="1080" y="706" width="1008" height="86" rx="10" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="1098" y="734" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">4. rankingStrategy.score(doc, terms, index) for each candidate</text>
  <text x="1098" y="760" font-family="Chalkboard SE" font-size="13.5" fill="#111">TF-IDF today, BM25 by swapping one field &#8212; no document is re-indexed either way</text>
  <text x="1098" y="782" font-family="Chalkboard SE" font-size="12.5" fill="#15803d" font-weight="bold">scoring touches only the candidate set, never the whole corpus &#10003;</text>

  <path d="M1584,792 L1584,814" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#ahb)"/>

  <rect x="1080" y="818" width="1008" height="86" rx="10" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="1098" y="846" font-family="Chalkboard SE" font-size="14.5" fill="#111" font-weight="bold">5. sort by score DESC &#8594; subList(offset, offset+limit) &#8594; build snippet + matchedTerms</text>
  <text x="1098" y="872" font-family="Chalkboard SE" font-size="13.5" fill="#111">SortOrder can override relevance with DATE_ASC / DATE_DESC</text>
  <text x="1098" y="894" font-family="Chalkboard SE" font-size="12.5" fill="#dc2626" font-weight="bold">the full candidate list is sorted before paging &#8658; page 500 costs the same as page 1</text>

  <path d="M1584,904 L1584,926" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#ahg)"/>

  <rect x="1080" y="930" width="1008" height="76" rx="10" fill="none" stroke="#15803d" stroke-width="3"/>
  <text x="1098" y="958" font-family="Chalkboard SE" font-size="15" fill="#15803d" font-weight="bold">&#8658; List&lt;SearchResult&gt; — document + score + matchedTerms + snippet</text>
  <text x="1098" y="984" font-family="Chalkboard SE" font-size="12.5" fill="#6b7280">the caller renders straight from this: no second trip into the index, no id-to-document join</text>

  <!-- ══════════ BOTTOM BAND ══════════ -->
  <rect x="50" y="1000" width="972" height="190" rx="14" fill="none" stroke="#7e22ce" stroke-width="3"/>
  <text x="76" y="1034" font-family="Marker Felt" font-size="19" fill="#7e22ce" font-weight="bold">AND vs OR — one line of set algebra, two products</text>
  <text x="76" y="1064" font-family="Chalkboard SE" font-size="14" fill="#111"><tspan font-weight="bold">OR</tspan> = union of posting lists &#8658; broad recall; precision is recovered by the SCORE, not the filter</text>
  <text x="76" y="1090" font-family="Chalkboard SE" font-size="14" fill="#111"><tspan font-weight="bold">AND</tspan> = intersection &#8658; precise; sort lists by size and start with the smallest, so the loop</text>
  <text x="96" y="1112" font-family="Chalkboard SE" font-size="14" fill="#111">shrinks fastest and you never touch the long tail of a common term</text>
  <text x="76" y="1140" font-family="Chalkboard SE" font-size="13" fill="#15803d" font-weight="bold">"Smallest posting list first" is the one optimisation an interviewer expects you to name unprompted &#10003;</text>
  <text x="76" y="1166" font-family="Chalkboard SE" font-size="13" fill="#dc2626" font-weight="bold">Phrase queries ("design patterns" in order) need POSITIONS in the postings — this model does not store them.</text>

  <rect x="1052" y="1000" width="1038" height="190" rx="14" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="10,8"/>
  <text x="1078" y="1034" font-family="Marker Felt" font-size="19" fill="#1e40af" font-weight="bold">COST OF EACH PIPELINE</text>
  <text x="1078" y="1064" font-family="Chalkboard SE" font-size="14" fill="#111"><tspan font-weight="bold">write:</tspan> O(T) tokens to analyse + O(distinct terms) map writes + O(observers) &#8212; all under ONE write lock</text>
  <text x="1078" y="1090" font-family="Chalkboard SE" font-size="14" fill="#111"><tspan font-weight="bold">read:</tspan> O(Q) tokenize + <tspan fill="#dc2626" font-weight="bold">O(Q &#183; V &#183; L&#178;) fuzzy</tspan> + O(&#931; postings) candidates + O(C&#183;Q) score + O(C log C) sort</text>
  <text x="1078" y="1116" font-family="Chalkboard SE" font-size="13" fill="#6b7280">T = doc tokens &#183; Q = query terms &#183; V = vocabulary size &#183; C = candidate docs &#183; L = term length</text>
  <text x="1078" y="1144" font-family="Chalkboard SE" font-size="13" fill="#15803d" font-weight="bold">Everything except fuzzy is proportional to the MATCHES, never to the corpus &#8212; that is what inverting buys.</text>
  <text x="1078" y="1172" font-family="Chalkboard SE" font-size="13" fill="#6b7280">Legend: <tspan fill="#ea580c" font-weight="bold">orange = analysis</tspan> &#183; <tspan fill="#2563eb" font-weight="bold">blue = index &amp; scoring</tspan> &#183; <tspan fill="#db2777" font-weight="bold">pink = query expansion</tspan> &#183; <tspan fill="#15803d" font-weight="bold">green = output / events</tspan> &#183; <tspan fill="#dc2626" font-weight="bold">red = honest gap</tspan></text>
</svg>
