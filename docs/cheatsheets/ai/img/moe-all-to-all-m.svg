<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1778" viewBox="0 0 600 1778">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1778" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">ONE MOE LAYER ACROSS GPUS</text>
<path d="M30.0,76 Q300.0,92 570.0,74" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="252.0" x2="300.0" y2="332.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="424.0" x2="300.0" y2="504.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="596.0" x2="300.0" y2="714.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="806.0" x2="300.0" y2="886.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="978.0" x2="300.0" y2="1058.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<rect x="50" y="108" width="94.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="132" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Dispatch</text>
<rect x="50" y="662" width="93.078125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="686" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Combine</text>
<rect x="50" y="1186" width="80.03125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="1210" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Traffic</text>
<rect x="134.5234375" y="166.0" width="330.953125" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="206.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Attention</text>
<text x="300.0" y="236.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">dense, every GPU, its own tokens</text>
<rect x="191.015625" y="338.0" width="217.96875" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="378.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Router</text>
<text x="300.0" y="408.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">2 experts per token</text>
<rect x="126.515625" y="510.0" width="346.96875" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="550.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">All-to-all #1: dispatch</text>
<text x="300.0" y="580.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">send tokens to their experts' GPUs</text>
<rect x="144.5078125" y="720.0" width="310.984375" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="760.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Experts</text>
<text x="300.0" y="790.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">each GPU runs its own experts</text>
<rect x="123.5390625" y="892.0" width="352.921875" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="932.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">All-to-all #2: combine</text>
<text x="300.0" y="962.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">results to home GPU, weight by g_i</text>
<rect x="210.0" y="1064.0" width="180" height="56" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="1104.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Next layer</text>
<rect x="62.0" y="1244.0" width="476" height="176" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="1284.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Traffic for a batch of 4,096 tokens</text>
<text x="300.0" y="1314.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one all-to-all: 4,096 tokens × 2 experts × 4,096</text>
<text x="300.0" y="1344.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">wide × 2 bytes = about 67 MB</text>
<text x="300.0" y="1374.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">2 per layer × 32 layers = about 4.3 GB per</text>
<text x="300.0" y="1404.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">forward pass</text>
<rect x="36" y="1460" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1504" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1544" font-family="Chalkboard SE" font-size="21" fill="#374151">• Experts 0, 1 on GPU 0; 2, 3 on GPU 1; and</text>
<text x="77" y="1574" font-family="Chalkboard SE" font-size="21" fill="#374151">so on</text>
<text x="62" y="1614" font-family="Chalkboard SE" font-size="21" fill="#374151">• Keep EP inside one NVLink node</text>
<text x="62" y="1654" font-family="Chalkboard SE" font-size="21" fill="#374151">• A hot expert gets more compute and more</text>
<text x="77" y="1684" font-family="Chalkboard SE" font-size="21" fill="#374151">traffic</text>
<text x="62" y="1724" font-family="Chalkboard SE" font-size="21" fill="#374151">• Every other GPU waits for the slowest</text>
</svg>