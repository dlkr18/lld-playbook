<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1800" viewBox="0 0 600 1800">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1800" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">SEARCH SMALL, SHOW BIG</text>
<path d="M55.9140625,76 Q300.0,92 544.0859375,74" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="252.0" x2="300.0" y2="332.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<rect x="274.015625" y="263.0" width="51.96875" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="285.0" font-family="Chalkboard SE" font-size="19" fill="#1f2937" text-anchor="middle">split</text>
<line x1="300.0" y1="424.0" x2="300.0" y2="504.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<path d="M453.0,553.0 L582,553.0 L582,950.0 L470.453125,950.0" stroke="#7e22ce" stroke-width="3" fill="none" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ah-purple)"/>
<line x1="300.0" y1="806.0" x2="300.0" y2="886.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="1008.0" x2="300.0" y2="1088.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="1180.0" x2="300.0" y2="1260.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="50" y="108" width="69.0625" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="132" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Ingest</text>
<rect x="50" y="662" width="70.0625" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="686" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Query</text>
<rect x="106.0546875" y="166.0" width="387.890625" height="86" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="300.0" y="206.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Parent: a section</text>
<text x="300.0" y="236.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">"Enterprise plans", up to ≈1,000 tokens</text>
<rect x="120.0234375" y="338.0" width="359.953125" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="378.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Children: 100 to 200 tokens</text>
<text x="300.0" y="408.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">each stores its parent's ID</text>
<rect x="147.0" y="510.0" width="306.0" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="550.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Index the children only</text>
<text x="300.0" y="580.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">embed + vector index</text>
<rect x="108.5078125" y="720.0" width="382.984375" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="760.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">"Can enterprise customers get</text>
<text x="300.0" y="790.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">a refund after 30 days?"</text>
<rect x="137.546875" y="892.0" width="324.90625" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="932.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Search the children</text>
<text x="300.0" y="962.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">best: "...may request a prorated</text>
<text x="300.0" y="992.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">refund within 60 days..."</text>
<rect x="155.515625" y="1094.0" width="288.96875" height="86" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="300.0" y="1134.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Swap child for parent</text>
<text x="300.0" y="1164.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one copy per shared parent</text>
<rect x="142.9765625" y="1266.0" width="314.046875" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1306.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Model reads the section</text>
<text x="300.0" y="1336.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">incl. "After that, the</text>
<text x="300.0" y="1366.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">contract terms apply."</text>
<rect x="36" y="1422" width="528" height="348" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1466" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1506" font-family="Chalkboard SE" font-size="21" fill="#374151">• Matching wants small text; answering</text>
<text x="77" y="1536" font-family="Chalkboard SE" font-size="21" fill="#374151">wants context</text>
<text x="62" y="1576" font-family="Chalkboard SE" font-size="21" fill="#374151">• Cost: 5 parents × 800 tokens = 4,000</text>
<text x="77" y="1606" font-family="Chalkboard SE" font-size="21" fill="#374151">prompt tokens</text>
<text x="62" y="1646" font-family="Chalkboard SE" font-size="21" fill="#374151">• Lighter variant: matched sentence +</text>
<text x="77" y="1676" font-family="Chalkboard SE" font-size="21" fill="#374151">neighbours</text>
<text x="62" y="1716" font-family="Chalkboard SE" font-size="21" fill="#374151">• Cheaper fix for context: embed the</text>
<text x="77" y="1746" font-family="Chalkboard SE" font-size="21" fill="#374151">heading path</text>
</svg>