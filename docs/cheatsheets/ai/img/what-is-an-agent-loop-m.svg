<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1308" viewBox="0 0 600 1308">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1308" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">AN AGENT: THE MODEL PICKS</text>
<text x="300.0" y="106" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">THE NEXT STEP</text>
<path d="M34.9296875,124 Q300.0,140 565.0703125,122" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="232.0" x2="300.0" y2="312.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="434.0" x2="300.0" y2="514.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="223.0078125" y="445.0" width="153.984375" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="467.0" font-family="Chalkboard SE" font-size="19" fill="#16a34a" text-anchor="middle">answer and stop</text>
<path d="M422.5078125,376.0 L582,376.0 L582,720.0 L463.0,720.0" stroke="#2563eb" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-blue)"/>
<rect x="570" y="468.0078125" width="24" height="159.984375" rx="6" fill="#ffffff"/>
<text x="582" y="548.0" font-family="Chalkboard SE" font-size="19" fill="#2563eb" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 582 548.0)">tool + arguments</text>
<line x1="300.0" y1="778.0" x2="300.0" y2="858.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<path d="M189.5078125,922.0 L18,922.0 L18,376.0 L169.4921875,376.0" stroke="#ea580c" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-orange)"/>
<rect x="210.0" y="176.0" width="180" height="56" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="216.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Goal</text>
<rect x="177.4921875" y="318.0" width="245.015625" height="116" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="358.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Model</text>
<text x="300.0" y="388.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">reads everything so far</text>
<text x="300.0" y="418.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">chooses the next step</text>
<rect x="210.0" y="520.0" width="180" height="56" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="560.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Reply</text>
<rect x="145.0" y="662.0" width="310.0" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="702.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Your code runs the tool</text>
<text x="300.0" y="732.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">checks permissions</text>
<text x="300.0" y="762.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">stops the loop after N steps</text>
<rect x="189.5078125" y="864.0" width="220.984375" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="904.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Observation</text>
<text x="300.0" y="934.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">result or error,</text>
<text x="300.0" y="964.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">added to the history</text>
<rect x="36" y="1020" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1064" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1104" font-family="Chalkboard SE" font-size="21" fill="#374151">• Agent = the model decides the control flow</text>
<text x="62" y="1144" font-family="Chalkboard SE" font-size="21" fill="#374151">• Steps are unknown in advance: 2 or 9</text>
<text x="62" y="1184" font-family="Chalkboard SE" font-size="21" fill="#374151">• The loop is yours: tools, limits, permissions</text>
<text x="62" y="1224" font-family="Chalkboard SE" font-size="21" fill="#374151">• Test: can you predict the steps from the</text>
<text x="77" y="1254" font-family="Chalkboard SE" font-size="21" fill="#374151">code?</text>
</svg>