<text x="1737.5" y="626.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">tools: read claims, propose change</text>
<text x="1737.5" y="656.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">step cap + token budget</text>
<text x="1737.5" y="686.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">user approves a summary</text>
