<line x1="390.8663101604278" y1="386.0" x2="339.80084633752176" y2="466.92577741426635" stroke="#1f2937" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah-ink)"/>
<path d="M422.984375,725.0 L567,725.0 L567,1076.0 L415.5,1076.0" stroke="#dc2626" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-red)"/>
