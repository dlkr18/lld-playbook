<line x1="300.0" y1="1134.0" x2="300.0" y2="1214.0" stroke="#7e22ce" stroke-width="3" marker-end="url(#ah-purple)"/>
<rect x="130.5" y="128.0" width="339.0" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="168.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">600 shared cases</text>
<text x="300.0" y="198.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">v1 and v2 answer the same inputs</text>
<rect x="92.0" y="300.0" width="180" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="182.0" y="340.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Both pass</text>
<text x="182.0" y="370.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">474</text>
<rect x="328.0" y="300.0" width="180" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="418.0" y="340.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Both fail</text>
<text x="418.0" y="370.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">66</text>
<rect x="179.015625" y="472.0" width="241.96875" height="116" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="512.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Concordant: 540</text>
<text x="300.0" y="542.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">no information about</text>
<text x="300.0" y="572.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">which version is better</text>
<rect x="177.015625" y="674.0" width="245.96875" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="714.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">v1 passes, v2 fails</text>
<text x="300.0" y="744.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">b = 18</text>
<rect x="177.015625" y="846.0" width="245.96875" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="886.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">v1 fails, v2 passes</text>
<text x="300.0" y="916.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">c = 42</text>
<rect x="192.5" y="1018.0" width="215.0" height="116" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="1058.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Discordant: 60</text>
<text x="300.0" y="1088.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">d = (42 − 18) / 600</text>
<text x="300.0" y="1118.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">= +4.0 points</text>
<rect x="151.5078125" y="1220.0" width="296.984375" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1260.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Paired 95% interval</text>
<text x="300.0" y="1290.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">+1.5 to +6.5 points</text>
<text x="300.0" y="1320.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">McNemar χ² = 9.6, p ≈ 0.002</text>
<rect x="36" y="1376" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1420" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1460" font-family="Chalkboard SE" font-size="21" fill="#374151">• Unpaired, same data: 4.0 ± 4.1, inconclusive</text>
<text x="62" y="1500" font-family="Chalkboard SE" font-size="21" fill="#374151">• Gate: whole interval above −2 points</text>
<text x="62" y="1540" font-family="Chalkboard SE" font-size="21" fill="#374151">• Sampled outputs: run each case several</text>
<text x="77" y="1570" font-family="Chalkboard SE" font-size="21" fill="#374151">times</text>
<text x="62" y="1610" font-family="Chalkboard SE" font-size="21" fill="#374151">• Keep the judge at temperature 0</text>
</svg>