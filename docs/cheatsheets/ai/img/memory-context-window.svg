<text x="96.0" y="648" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Long-term memory: what you write out and read back</text>
<text x="1070.0" y="648" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Memory is a read path and a write path you design</text>
