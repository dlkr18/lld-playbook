<line x1="754.0" y1="424.0" x2="698.0" y2="424.0" stroke="#ea580c" stroke-width="3" marker-end="url(#ah-orange)"/>
<line x1="502.0" y1="472.0" x2="502.0" y2="576.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="467.5" y="495.0" width="69.0" height="30" rx="6" fill="#ffffff"/>
<text x="502.0" y="517.0" font-family="Chalkboard SE" font-size="19" fill="#16a34a" text-anchor="middle">× x^T</text>
<line x1="1828.0" y1="472.0" x2="1828.0" y2="591.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="1804.0" y="502.5" width="48.0" height="30" rx="6" fill="#ffffff"/>
<text x="1828.0" y="524.5" font-family="Chalkboard SE" font-size="19" fill="#16a34a" text-anchor="middle">× h</text>
<rect x="312.0" y="155.0" width="380" height="96" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="502.0" y="199.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Hidden s1 = W1 x + b1</text>
<text x="502.0" y="229.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(0.6, −0.2)</text>
<rect x="754.0" y="140.0" width="380" height="126" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="944.0" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">ReLU h</text>
<text x="944.0" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(0.6, 0.0)</text>
<text x="944.0" y="244.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">unit 2 is off</text>
<rect x="1196.0" y="155.0" width="380" height="96" rx="16" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="1386.0" y="199.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Logit s2 = W2 h</text>
<text x="1386.0" y="229.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">0.7 × 0.6 = 0.42</text>
<rect x="1638.0" y="155.0" width="380" height="96" rx="16" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="1828.0" y="199.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">p = σ(0.42) = 0.6035</text>
<text x="1828.0" y="229.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">loss −log p = 0.5050</text>
<rect x="312.0" y="376.0" width="380" height="96" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="502.0" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Through the ReLU gate</text>
<text x="502.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(−0.278, 0.0)</text>
<rect x="754.0" y="376.0" width="380" height="96" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="944.0" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">∂L/∂h = −0.3965 · W2</text>
<text x="944.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(−0.278, 0.238)</text>
<rect x="1638.0" y="376.0" width="380" height="96" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1828.0" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">∂L/∂s2 = p − y</text>
<text x="1828.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">−0.3965</text>
<rect x="312.0" y="582.0" width="380" height="126" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="502.0" y="626.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">∂L/∂W1 = ∂L/∂s1 · x^T</text>
<text x="502.0" y="656.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">only x1 → unit 1:</text>
<text x="502.0" y="686.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">−0.278</text>
<rect x="1638.0" y="597.0" width="380" height="96" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="1828.0" y="641.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">∂L/∂W2 = −0.3965 · h</text>
<text x="1828.0" y="671.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(−0.238, 0.0)</text>
<rect x="60" y="778" width="2020" height="158" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="96" y="824" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="870" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Input x = (1, 0), target 1, as in Step 2</text>
<text x="1070.0" y="870" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Each layer backward: 2 matmuls</text>
<text x="96.0" y="914" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Layer 1's gradient is a product of every layer above</text>
<text x="1070.0" y="914" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; PyTorch autograd gives the same numbers</text>
</svg>