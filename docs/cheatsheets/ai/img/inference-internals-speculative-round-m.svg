<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1504" viewBox="0 0 600 1504">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1504" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">ONE ROUND OF SPECULATIVE</text>
<text x="300.0" y="106" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">DECODING</text>
<path d="M40.9296875,124 Q300.0,140 559.0703125,122" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="330.0" x2="300.0" y2="410.0" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)"/>
<rect x="257.515625" y="341.0" width="84.96875" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="363.0" font-family="Chalkboard SE" font-size="19" fill="#2563eb" text-anchor="middle">4 drafts</text>
<line x1="300.0" y1="532.0" x2="300.0" y2="612.0" stroke="#7e22ce" stroke-width="3" marker-end="url(#ah-purple)"/>
<path d="M473.9609375,661.0 L582,661.0 L582,1088.0 L476.46875,1088.0" stroke="#16a34a" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<rect x="570" y="829.015625" width="24" height="90.96875" rx="6" fill="#ffffff"/>
<text x="582" y="874.5" font-family="Chalkboard SE" font-size="19" fill="#16a34a" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 582 874.5)">accepted</text>
<line x1="300.0" y1="704.0" x2="300.0" y2="822.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<line x1="300.0" y1="944.0" x2="300.0" y2="1024.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<rect x="240.015625" y="955.0" width="119.96875" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="977.0" font-family="Chalkboard SE" font-size="19" fill="#dc2626" text-anchor="middle">replacement</text>
<path d="M131.53125,1088.0 L18,1088.0 L18,272.0 L160.03125,272.0" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ah-ink)"/>
<rect x="6" y="625.9921875" width="24" height="108.015625" rx="6" fill="#ffffff"/>
<text x="18" y="680.0" font-family="Chalkboard SE" font-size="19" fill="#1f2937" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 18 680.0)">next round</text>
<rect x="50" y="156" width="169.140625" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="180" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Propose + verify</text>
<rect x="50" y="770" width="71.078125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="794" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Result</text>
<rect x="168.03125" y="214.0" width="263.9375" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Drafter</text>
<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">proposes k = 4 tokens</text>
<text x="300.0" y="314.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">5% of a target step each</text>
<rect x="138.0078125" y="416.0" width="323.984375" height="116" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="456.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Target model</text>
<text x="300.0" y="486.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">scores all 4 positions in one pass</text>
<text x="300.0" y="516.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">costs about one decode step</text>
<rect x="126.0390625" y="618.0" width="347.921875" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="658.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Check each draft in order</text>
<text x="300.0" y="688.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">accept with probability min(1, p/q)</text>
<rect x="156.0078125" y="828.0" width="287.984375" height="116" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="868.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">First rejection</text>
<text x="300.0" y="898.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">drop the rest of the draft</text>
<text x="300.0" y="928.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">resample from max(0, p − q)</text>
<rect x="131.53125" y="1030.0" width="336.9375" height="116" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="1070.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Emit</text>
<text x="300.0" y="1100.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">the accepted drafts</text>
<text x="300.0" y="1130.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">+ one replacement or bonus token</text>
<rect x="36" y="1186" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1230" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1270" font-family="Chalkboard SE" font-size="21" fill="#374151">• α = 0.8, k = 4: 3.36 tokens per target pass</text>
<text x="62" y="1310" font-family="Chalkboard SE" font-size="21" fill="#374151">• Round costs 1 + 4 × 0.05 = 1.2 steps: ≈</text>
<text x="77" y="1340" font-family="Chalkboard SE" font-size="21" fill="#374151">2.8×</text>
<text x="62" y="1380" font-family="Chalkboard SE" font-size="21" fill="#374151">• α = 0.5: 1.6× · α = 0.3: 1.2×</text>
<text x="62" y="1420" font-family="Chalkboard SE" font-size="21" fill="#374151">• Same output as the target; gain shrinks at</text>
<text x="77" y="1450" font-family="Chalkboard SE" font-size="21" fill="#374151">big batch</text>
</svg>