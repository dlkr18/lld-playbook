<text x="300.0" y="1706.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Backprop + update</text>
<text x="300.0" y="1736.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">θ ← θ − η∇L</text>
<rect x="36" y="1792" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1836" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1876" font-family="Chalkboard SE" font-size="21" fill="#374151">• cosine ignores length: angle only</text>
<text x="62" y="1916" font-family="Chalkboard SE" font-size="21" fill="#374151">• minimize cross-entropy = maximize</text>
<text x="77" y="1946" font-family="Chalkboard SE" font-size="21" fill="#374151">likelihood</text>
<text x="62" y="1986" font-family="Chalkboard SE" font-size="21" fill="#374151">• matmul cost ≈ 2·m·k·n FLOPs</text>
<text x="62" y="2026" font-family="Chalkboard SE" font-size="21" fill="#374151">• subtract max before exp (stable softmax)</text>
