<rect width="2140" height="770" fill="#ffffff"/>
<text x="1070.0" y="70" font-family="Marker Felt" font-size="46" fill="#1e40af" text-anchor="middle" font-weight="bold">THE CIRCUIT BREAKER</text>
<path d="M833.3515625,88 Q1070.0,106 1306.6484375,86" stroke="#1e40af" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<line x1="675.0" y1="203.0" x2="1459.0" y2="203.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<line x1="1520.8262711864406" y1="266.0" x2="1239.775444103429" y2="373.8503986855135" stroke="#ea580c" stroke-width="3" marker-end="url(#ah-orange)"/>
<rect x="1303.484375" y="289.0" width="148.03125" height="30" rx="6" fill="#ffffff"/>
<text x="1377.5" y="311.0" font-family="Chalkboard SE" font-size="19" fill="#ea580c" text-anchor="middle">cool-down over</text>
<line x1="850.0" y1="439.0" x2="681.0" y2="439.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<line x1="1290.0" y1="439.0" x2="1459.0" y2="439.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<line x1="455.0" y1="391.0" x2="455.0" y2="272.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<line x1="1685.0" y1="391.0" x2="1685.0" y2="272.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<rect x="235.0" y="140.0" width="440" height="126" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="455.0" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Closed</text>
<text x="455.0" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">calls go through, failures counted</text>
<text x="455.0" y="244.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">5 failures in a row: open</text>
<rect x="1465.0" y="140.0" width="440" height="126" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1685.0" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Open</text>
<text x="1685.0" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">fail fast, nothing is sent</text>
<text x="1685.0" y="244.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">requests go to the fallback</text>
<rect x="235.0" y="391.0" width="440" height="96" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="455.0" y="435.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Trial succeeds</text>
<text x="455.0" y="465.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">close, reset the count</text>
<rect x="850.0" y="376.0" width="440" height="126" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="1070.0" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Half-open</text>
<text x="1070.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">after a 30 s cool-down</text>
<text x="1070.0" y="480.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one trial call let through</text>
<rect x="1465.0" y="391.0" width="440" height="96" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1685.0" y="435.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Trial fails</text>
<text x="1685.0" y="465.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">reopen, wait again</text>
<rect x="60" y="572" width="2020" height="158" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="96" y="618" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="664" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Or open on &gt; 50% failures over a window</text>
<text x="1070.0" y="664" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; A 400 is your bug: it does not count</text>
<text x="96.0" y="708" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; 60 s outage: 1,800 calls naive, 6 protected</text>
<text x="1070.0" y="708" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Pair it with a 10% retry budget</text>
</svg>