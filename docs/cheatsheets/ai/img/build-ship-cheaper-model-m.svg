<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1690" viewBox="0 0 600 1690">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1690" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">SHOULD THE CHEAPER MODEL</text>
<text x="300.0" y="106" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">SHIP?</text>
<path d="M31.359375,124 Q300.0,140 568.640625,122" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="292.0" x2="300.0" y2="372.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="494.0" x2="300.0" y2="574.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="696.0" x2="300.0" y2="776.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="898.0" x2="300.0" y2="978.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<rect x="255.5" y="909.0" width="89.0" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="931.0" font-family="Chalkboard SE" font-size="19" fill="#dc2626" text-anchor="middle">too risky</text>
<line x1="300.0" y1="1100.0" x2="300.0" y2="1180.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="237.0" y="1111.0" width="126.0" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="1133.0" font-family="Chalkboard SE" font-size="19" fill="#16a34a" text-anchor="middle">no regression</text>
<rect x="182.9921875" y="176.0" width="234.015625" height="116" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="216.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Proposal</text>
<text x="300.0" y="246.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">cheaper answer model</text>
<text x="300.0" y="276.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">≈$500 a month saved</text>
<rect x="167.0234375" y="378.0" width="265.953125" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="418.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Offline suite</text>
<text x="300.0" y="448.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">104/120 vs 108/120</text>
<text x="300.0" y="478.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">paired split 9–5, p = 0.42</text>
<rect x="172.5234375" y="580.0" width="254.953125" height="116" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="620.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Read the 9 losses</text>
<text x="300.0" y="650.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">unanswerable slice held</text>
<text x="300.0" y="680.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">2 wrong policy durations</text>
<rect x="157.046875" y="782.0" width="285.90625" height="116" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="822.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Risk check</text>
<text x="300.0" y="852.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">2/120 wrong: 0.5% to 5.9%</text>
<text x="300.0" y="882.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">spec line is 3% wrong</text>
<rect x="154.0234375" y="984.0" width="291.953125" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1024.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Decision: not yet</text>
<text x="300.0" y="1054.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">a week of shadow evaluation</text>
<text x="300.0" y="1084.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">300 paired questions a day</text>
<rect x="171.0078125" y="1186.0" width="257.984375" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1226.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Then canary at 5%</text>
<text x="300.0" y="1256.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">automatic rollback</text>
<text x="300.0" y="1286.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">then ramp to 100%</text>
<rect x="36" y="1342" width="528" height="318" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1386" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1426" font-family="Chalkboard SE" font-size="21" fill="#374151">• Not significant is not the same as no</text>
<text x="77" y="1456" font-family="Chalkboard SE" font-size="21" fill="#374151">difference</text>
<text x="62" y="1496" font-family="Chalkboard SE" font-size="21" fill="#374151">• +1% wrong ≈ $79,000 a month at $150</text>
<text x="77" y="1526" font-family="Chalkboard SE" font-size="21" fill="#374151">each</text>
<text x="62" y="1566" font-family="Chalkboard SE" font-size="21" fill="#374151">• 5% canary: 150 a day, ≈9 days for 84% →</text>
<text x="77" y="1596" font-family="Chalkboard SE" font-size="21" fill="#374151">81%</text>
<text x="62" y="1636" font-family="Chalkboard SE" font-size="21" fill="#374151">• Shadow: hundreds of paired cases a day</text>
</svg>