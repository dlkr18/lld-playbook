<rect x="570" y="1206.5078125" width="24" height="70.984375" rx="6" fill="#ffffff"/>
<text x="582" y="1242.0" font-family="Chalkboard SE" font-size="19" fill="#ea580c" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 582 1242.0)">× W^T</text>
<line x1="300.0" y1="1218.0" x2="300.0" y2="1298.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="50" y="108" width="92.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="132" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Forward</text>
<rect x="50" y="834" width="108.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="858" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Backward</text>
<rect x="50" y="1044" width="89.015625" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="1068" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Weights</text>
<rect x="210.0" y="166.0" width="180" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="206.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Context h</text>
<text x="300.0" y="236.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">[1.0, 2.0, −1.0]</text>
<rect x="195.5234375" y="338.0" width="208.953125" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="378.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Logits z = W h</text>
<text x="300.0" y="408.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">[1.5, 1.0, −1.0]</text>
<rect x="185.015625" y="510.0" width="229.96875" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="550.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Softmax p</text>
<text x="300.0" y="580.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">[0.592, 0.359, 0.049]</text>
<rect x="188.0234375" y="682.0" width="223.953125" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="722.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Loss −log p(mat)</text>
<text x="300.0" y="752.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">0.524</text>
<rect x="179.5234375" y="892.0" width="240.953125" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="932.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Logits: p − y</text>
<text x="300.0" y="962.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">[−0.408, 0.359, 0.049]</text>
<rect x="162.015625" y="1102.0" width="275.96875" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1142.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Weights: (p − y) h^T</text>
<text x="300.0" y="1172.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">3 × 3 outer product</text>
<text x="300.0" y="1202.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">mat row −0.816 at h2</text>
<rect x="196.515625" y="1304.0" width="206.96875" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1344.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Step, η = 0.5</text>
<text x="300.0" y="1374.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">W ← W − η ∇W</text>
<text x="300.0" y="1404.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">loss 0.524 → 0.078</text>
<rect x="134.53125" y="1506.0" width="330.9375" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1546.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Layer below: W^T (p − y)</text>
<text x="300.0" y="1576.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">[−0.204, −0.049, 0.0]</text>
<rect x="36" y="1632" width="528" height="228" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1676" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1716" font-family="Chalkboard SE" font-size="21" fill="#374151">• p − y: predicted minus actual</text>
<text x="62" y="1756" font-family="Chalkboard SE" font-size="21" fill="#374151">• Entries of p − y always sum to zero</text>
<text x="62" y="1796" font-family="Chalkboard SE" font-size="21" fill="#374151">• Backprop = this chain rule, layer by layer</text>
<text x="62" y="1836" font-family="Chalkboard SE" font-size="21" fill="#374151">• One backward pass ≈ 2 forward passes</text>
</svg>