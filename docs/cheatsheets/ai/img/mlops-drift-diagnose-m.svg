<text x="62" y="2622" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="2662" font-family="Chalkboard SE" font-size="21" fill="#374151">• Concept drift: only labels can see it</text>
