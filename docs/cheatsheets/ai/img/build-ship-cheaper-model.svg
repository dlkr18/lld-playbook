<rect width="2140" height="770" fill="#ffffff"/>
<text x="1070.0" y="70" font-family="Marker Felt" font-size="46" fill="#1e40af" text-anchor="middle" font-weight="bold">SHOULD THE CHEAPER MODEL SHIP?</text>
<path d="M697.2890625,88 Q1070.0,106 1442.7109375,86" stroke="#1e40af" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<line x1="670.0" y1="203.0" x2="854.0" y2="203.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="1280.0" y1="203.0" x2="1464.0" y2="203.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="1680.0" y1="266.0" x2="1680.0" y2="370.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="1470.0" y1="439.0" x2="1286.0" y2="439.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<rect x="1327.5" y="407.0" width="95.0" height="30" rx="6" fill="#ffffff"/>
<text x="1375.0" y="429.0" font-family="Chalkboard SE" font-size="19" fill="#dc2626" text-anchor="middle">too risky</text>
<line x1="860.0" y1="439.0" x2="676.0" y2="439.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="699.0" y="407.0" width="132.0" height="30" rx="6" fill="#ffffff"/>
<text x="765.0" y="429.0" font-family="Chalkboard SE" font-size="19" fill="#16a34a" text-anchor="middle">no regression</text>
<rect x="250.0" y="140.0" width="420" height="126" rx="16" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="460.0" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Proposal</text>
<text x="460.0" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">cheaper answer model</text>
<text x="460.0" y="244.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">≈$500 a month saved</text>
<rect x="860.0" y="140.0" width="420" height="126" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1070.0" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Offline suite</text>
<text x="1070.0" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">104/120 vs 108/120</text>
<text x="1070.0" y="244.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">paired split 9–5, p = 0.42</text>
<rect x="1470.0" y="140.0" width="420" height="126" rx="16" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="1680.0" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Read the 9 losses</text>
<text x="1680.0" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">unanswerable slice held</text>
<text x="1680.0" y="244.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">2 wrong policy durations</text>
<rect x="250.0" y="376.0" width="420" height="126" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="460.0" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Then canary at 5%</text>
<text x="460.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">automatic rollback</text>
<text x="460.0" y="480.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">then ramp to 100%</text>
<rect x="860.0" y="376.0" width="420" height="126" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="1070.0" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Decision: not yet</text>
<text x="1070.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">a week of shadow evaluation</text>
<text x="1070.0" y="480.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">300 paired questions a day</text>
<rect x="1470.0" y="376.0" width="420" height="126" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1680.0" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Risk check</text>
<text x="1680.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">2/120 wrong: 0.5% to 5.9%</text>
<text x="1680.0" y="480.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">spec line is 3% wrong</text>
<rect x="60" y="572" width="2020" height="158" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="96" y="618" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="664" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Not significant is not the same as no difference</text>
<text x="1070.0" y="664" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; +1% wrong ≈ $79,000 a month at $150 each</text>
<text x="96.0" y="708" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; 5% canary: 150 a day, ≈9 days for 84% → 81%</text>
<text x="1070.0" y="708" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Shadow: hundreds of paired cases a day</text>
</svg>