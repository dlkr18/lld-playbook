<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1692" viewBox="0 0 600 1692">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1692" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">TENSOR PARALLELISM INSIDE</text>
<text x="300.0" y="106" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">ONE MLP</text>
<path d="M33.4140625,124 Q300.0,140 566.5859375,122" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="300.0" x2="300.0" y2="418.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<path d="M466.5,257.0 L582,257.0 L582,879.0 L465.4921875,879.0" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="510.0" x2="300.0" y2="628.0" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)"/>
<rect x="262.5078125" y="540.0" width="74.984375" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="562.0" font-family="Chalkboard SE" font-size="19" fill="#2563eb" text-anchor="middle">no talk</text>
<line x1="300.0" y1="922.0" x2="300.0" y2="1002.0" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)"/>
<rect x="262.5078125" y="933.0" width="74.984375" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="955.0" font-family="Chalkboard SE" font-size="19" fill="#2563eb" text-anchor="middle">no talk</text>
<path d="M453.4921875,692.0 L567,692.0 L567,1291.0 L442.4765625,1291.0" stroke="#ea580c" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-orange)"/>
<line x1="300.0" y1="1124.0" x2="300.0" y2="1242.0" stroke="#ea580c" stroke-width="3" marker-end="url(#ah-orange)"/>
<rect x="50" y="156" width="63.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="180" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Input</text>
<rect x="50" y="366" width="77.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="390" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Split A</text>
<rect x="50" y="576" width="75.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="600" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Split B</text>
<rect x="50" y="1190" width="93.078125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="1214" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Combine</text>
<rect x="133.5" y="214.0" width="333.0" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Input X</text>
<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">the same full input on every GPU</text>
<rect x="151.5234375" y="424.0" width="296.953125" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="464.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">GPU 1: GELU(X A1)</text>
<text x="300.0" y="494.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">A1 = first half of A's columns</text>
<rect x="146.5078125" y="634.0" width="306.984375" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="674.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">GPU 1: × B1</text>
<text x="300.0" y="704.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">B1 = matching half of B's rows</text>
<text x="300.0" y="734.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">→ partial sum Y1</text>
<rect x="142.5078125" y="836.0" width="314.984375" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="876.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">GPU 2: GELU(X A2)</text>
<text x="300.0" y="906.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">A2 = second half of A's columns</text>
<rect x="146.5078125" y="1008.0" width="306.984375" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1048.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">GPU 2: × B2</text>
<text x="300.0" y="1078.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">B2 = matching half of B's rows</text>
<text x="300.0" y="1108.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">→ partial sum Y2</text>
<rect x="165.5234375" y="1248.0" width="268.953125" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="1288.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">All-reduce</text>
<text x="300.0" y="1318.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">Y = Y1 + Y2 on both GPUs</text>
<rect x="36" y="1374" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1418" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1458" font-family="Chalkboard SE" font-size="21" fill="#374151">• Shown for 2 GPUs; in practice up to 8</text>
<text x="62" y="1498" font-family="Chalkboard SE" font-size="21" fill="#374151">• GELU is element-wise: no exchange before</text>
<text x="77" y="1528" font-family="Chalkboard SE" font-size="21" fill="#374151">B</text>
<text x="62" y="1568" font-family="Chalkboard SE" font-size="21" fill="#374151">• 2 all-reduces per layer forward, 2</text>
<text x="77" y="1598" font-family="Chalkboard SE" font-size="21" fill="#374151">backward</text>
<text x="62" y="1638" font-family="Chalkboard SE" font-size="21" fill="#374151">• On the critical path: keep it on NVLink</text>
</svg>