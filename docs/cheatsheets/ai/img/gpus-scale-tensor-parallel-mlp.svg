<rect x="992.5" y="140.0" width="345.0" height="96" rx="16" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="1165.0" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Input X</text>
<text x="1165.0" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">the same full input on every GPU</text>
<rect x="513.3333333333333" y="346.0" width="520" height="96" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="773.3333333333333" y="390.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">GPU 1: GELU(X A1)</text>
<text x="773.3333333333333" y="420.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">A1 = first half of A's columns</text>
<rect x="1296.6666666666665" y="346.0" width="520" height="96" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1556.6666666666665" y="390.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">GPU 2: GELU(X A2)</text>
<text x="1556.6666666666665" y="420.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">A2 = second half of A's columns</text>
<rect x="513.3333333333333" y="552.0" width="520" height="126" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="773.3333333333333" y="596.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">GPU 1: × B1</text>
<text x="773.3333333333333" y="626.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">B1 = matching half of B's rows</text>
<text x="773.3333333333333" y="656.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">→ partial sum Y1</text>
<rect x="1296.6666666666665" y="552.0" width="520" height="126" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="1556.6666666666665" y="596.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">GPU 2: × B2</text>
<text x="1556.6666666666665" y="626.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">B2 = matching half of B's rows</text>
<text x="1556.6666666666665" y="656.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">→ partial sum Y2</text>
<rect x="1024.5234375" y="788.0" width="280.953125" height="96" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1165.0" y="832.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">All-reduce</text>
<text x="1165.0" y="862.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">Y = Y1 + Y2 on both GPUs</text>
<rect x="60" y="954" width="2020" height="158" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="96" y="1000" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="1046" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Shown for 2 GPUs; in practice up to 8</text>
<text x="1070.0" y="1046" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; GELU is element-wise: no exchange before B</text>
<text x="96.0" y="1090" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; 2 all-reduces per layer forward, 2 backward</text>
<text x="1070.0" y="1090" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; On the critical path: keep it on NVLink</text>
