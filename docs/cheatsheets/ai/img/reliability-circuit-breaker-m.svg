<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1118" viewBox="0 0 600 1118">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1118" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">THE CIRCUIT BREAKER</text>
<path d="M96.3828125,76 Q300.0,92 503.6171875,74" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="244.0" x2="300.0" y2="324.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<line x1="300.0" y1="446.0" x2="300.0" y2="526.0" stroke="#ea580c" stroke-width="3" marker-end="url(#ah-orange)"/>
<rect x="228.984375" y="457.0" width="142.03125" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="479.0" font-family="Chalkboard SE" font-size="19" fill="#ea580c" text-anchor="middle">cool-down over</text>
<line x1="262.3082386363636" y1="648.0" x2="209.68988225732116" y2="728.9690117832697" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<line x1="342.3393215240642" y1="648.0" x2="401.5806834701798" y2="729.1538510583313" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<path d="M62.0,777.0 L18,777.0 L18,186.0 L125.5234375,186.0" stroke="#16a34a" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<path d="M538.0,777.0 L582,777.0 L582,388.0 L448.484375,388.0" stroke="#dc2626" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-red)"/>
<rect x="133.5234375" y="128.0" width="332.953125" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="168.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Closed</text>
<text x="300.0" y="198.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">calls go through, failures counted</text>
<text x="300.0" y="228.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">5 failures in a row: open</text>
<rect x="159.515625" y="330.0" width="280.96875" height="116" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="370.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Open</text>
<text x="300.0" y="400.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">fail fast, nothing is sent</text>
<text x="300.0" y="430.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">requests go to the fallback</text>
<rect x="169.5234375" y="532.0" width="260.953125" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="572.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Half-open</text>
<text x="300.0" y="602.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">after a 30 s cool-down</text>
<text x="300.0" y="632.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one trial call let through</text>
<rect x="62.0" y="734.0" width="232.953125" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="178.4765625" y="774.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Trial succeeds</text>
<text x="178.4765625" y="804.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">close, reset the count</text>
<rect x="335.015625" y="734.0" width="202.984375" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="436.5078125" y="774.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Trial fails</text>
<text x="436.5078125" y="804.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">reopen, wait again</text>
<rect x="36" y="860" width="528" height="228" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="904" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="944" font-family="Chalkboard SE" font-size="21" fill="#374151">• Or open on &gt; 50% failures over a window</text>
<text x="62" y="984" font-family="Chalkboard SE" font-size="21" fill="#374151">• A 400 is your bug: it does not count</text>
<text x="62" y="1024" font-family="Chalkboard SE" font-size="21" fill="#374151">• 60 s outage: 1,800 calls naive, 6 protected</text>
<text x="62" y="1064" font-family="Chalkboard SE" font-size="21" fill="#374151">• Pair it with a 10% retry budget</text>
</svg>