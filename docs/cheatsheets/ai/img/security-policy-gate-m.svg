<text x="62" y="1184" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1224" font-family="Chalkboard SE" font-size="21" fill="#374151">• Hijacked worst case: $100 of own orders</text>
<text x="62" y="1264" font-family="Chalkboard SE" font-size="21" fill="#374151">• Tainted: side effects need confirmation</text>
<text x="62" y="1304" font-family="Chalkboard SE" font-size="21" fill="#374151">• Output filter: links only to allowed hosts</text>
<text x="62" y="1344" font-family="Chalkboard SE" font-size="21" fill="#374151">• Unit-test the gate, not the model</text>
