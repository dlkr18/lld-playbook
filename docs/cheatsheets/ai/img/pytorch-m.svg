<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">workers · pin_memory</text>
<rect x="210.0" y="386.0" width="180" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
