<text x="300.0" y="770.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">loss.backward()</text>
<rect x="183.4921875" y="872.0" width="233.015625" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="912.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">clip_grad_norm_</text>
<text x="300.0" y="942.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">1.0</text>
<rect x="210.0" y="1044.0" width="180" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1084.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">opt.step()</text>
<text x="300.0" y="1114.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">sched.step()</text>
<rect x="210.0" y="1216.0" width="180" height="56" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1256.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">zero_grad()</text>
<rect x="62.0" y="1396.0" width="476" height="116" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="1436.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Per parameter: bf16 weights 2 B +</text>
<text x="300.0" y="1466.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">grads 2 B + fp32 master 4 B + Adam</text>
<text x="300.0" y="1496.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">m,v 8 B = 16 B</text>
<rect x="36" y="1552" width="528" height="398" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1596" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1636" font-family="Chalkboard SE" font-size="21" fill="#374151">• Initial loss should be ≈ ln(num classes)</text>
<text x="62" y="1676" font-family="Chalkboard SE" font-size="21" fill="#374151">• Overfit one batch first: loss must reach ≈</text>
<text x="77" y="1706" font-family="Chalkboard SE" font-size="21" fill="#374151">0</text>
<text x="62" y="1746" font-family="Chalkboard SE" font-size="21" fill="#374151">• .item() every step forces a GPU sync</text>
<text x="62" y="1786" font-family="Chalkboard SE" font-size="21" fill="#374151">• Checkpoint model · optimizer · scheduler</text>
<text x="77" y="1816" font-family="Chalkboard SE" font-size="21" fill="#374151">RNG</text>
<text x="62" y="1856" font-family="Chalkboard SE" font-size="21" fill="#374151">• OOM? micro-batch + accumulation,</text>
<text x="77" y="1886" font-family="Chalkboard SE" font-size="21" fill="#374151">checkpointing</text>
<text x="62" y="1926" font-family="Chalkboard SE" font-size="21" fill="#374151">• then LoRA / QLoRA, then FSDP</text>
</svg>