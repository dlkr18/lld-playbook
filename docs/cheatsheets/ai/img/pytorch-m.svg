<text x="300.0" y="456.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">autocast bf16</text>
<rect x="210.0" y="558.0" width="180" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
