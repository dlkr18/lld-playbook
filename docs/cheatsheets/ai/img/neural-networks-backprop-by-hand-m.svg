<text x="56" y="180" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Forward</text>
<rect x="50" y="912" width="108.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="936" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Backward</text>
