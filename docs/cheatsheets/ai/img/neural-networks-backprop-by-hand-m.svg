<rect x="148.0078125" y="214.0" width="303.984375" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Hidden s1 = W1 x + b1</text>
<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(0.6, −0.2)</text>
<rect x="210.0" y="386.0" width="180" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="426.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">ReLU h</text>
<text x="300.0" y="456.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(0.6, 0.0)</text>
<text x="300.0" y="486.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">unit 2 is off</text>
<rect x="188.0234375" y="588.0" width="223.953125" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="628.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Logit s2 = W2 h</text>
<text x="300.0" y="658.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">0.7 × 0.6 = 0.42</text>
<rect x="160.0234375" y="760.0" width="279.953125" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="800.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">p = σ(0.42) = 0.6035</text>
<text x="300.0" y="830.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">loss −log p = 0.5050</text>
<rect x="194.0" y="970.0" width="212.0" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="1010.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">∂L/∂s2 = p − y</text>
<text x="300.0" y="1040.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">−0.3965</text>
<rect x="150.53125" y="1142.0" width="298.9375" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1182.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">∂L/∂h = −0.3965 · W2</text>
<text x="300.0" y="1212.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(−0.278, 0.238)</text>
<rect x="147.0078125" y="1314.0" width="305.984375" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1354.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Through the ReLU gate</text>
<text x="300.0" y="1384.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(−0.278, 0.0)</text>
<rect x="145.5" y="1524.0" width="309.0" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1564.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">∂L/∂W1 = ∂L/∂s1 · x^T</text>
<text x="300.0" y="1594.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">only x1 → unit 1:</text>
<text x="300.0" y="1624.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">−0.278</text>
<rect x="150.515625" y="1726.0" width="298.96875" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1766.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">∂L/∂W2 = −0.3965 · h</text>
<text x="300.0" y="1796.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(−0.238, 0.0)</text>
<rect x="36" y="1852" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1896" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1936" font-family="Chalkboard SE" font-size="21" fill="#374151">• Input x = (1, 0), target 1, as in Step 2</text>
<text x="62" y="1976" font-family="Chalkboard SE" font-size="21" fill="#374151">• Each layer backward: 2 matmuls</text>
<text x="62" y="2016" font-family="Chalkboard SE" font-size="21" fill="#374151">• Layer 1's gradient is a product of every</text>
<text x="77" y="2046" font-family="Chalkboard SE" font-size="21" fill="#374151">layer above</text>
<text x="62" y="2086" font-family="Chalkboard SE" font-size="21" fill="#374151">• PyTorch autograd gives the same numbers</text>
</svg>