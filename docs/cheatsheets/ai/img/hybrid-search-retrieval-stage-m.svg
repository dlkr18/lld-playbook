<text x="62" y="1332" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1372" font-family="Chalkboard SE" font-size="21" fill="#374151">• Parallel: latency is the slower one, not the</text>
<text x="77" y="1402" font-family="Chalkboard SE" font-size="21" fill="#374151">sum</text>
<text x="62" y="1442" font-family="Chalkboard SE" font-size="21" fill="#374151">• A filter on one side only leaks documents</text>
<text x="62" y="1482" font-family="Chalkboard SE" font-size="21" fill="#374151">• Retrieve deeper than you keep (20 to 100)</text>
<text x="62" y="1522" font-family="Chalkboard SE" font-size="21" fill="#374151">• Measure recall at retrieval depth</text>
