<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">maths · code · logic</text>
<text x="300.0" y="314.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">with a checker</text>
<rect x="173.0" y="416.0" width="254.0" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="456.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Sample 8 attempts</text>
<text x="300.0" y="486.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">from the current model</text>
<text x="300.0" y="516.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">reasoning + final answer</text>
<rect x="156.0234375" y="618.0" width="287.953125" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="658.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Checker</text>
<text x="300.0" y="688.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">1 if correct, 0 if not</text>
<text x="300.0" y="718.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">answer matches · tests pass</text>
<rect x="175.5234375" y="858.0" width="248.953125" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="898.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Rewards</text>
<text x="300.0" y="928.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">1 0 0 1 0 1 0 0</text>
<text x="300.0" y="958.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">mean 0.375 · std 0.484</text>
<rect x="142.0234375" y="1060.0" width="315.953125" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1100.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Advantage</text>
<text x="300.0" y="1130.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">(reward − mean) / std</text>
<text x="300.0" y="1160.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">correct +1.29 · incorrect −0.77</text>
<rect x="159.046875" y="1262.0" width="281.90625" height="146" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="1302.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Update the model</text>
<text x="300.0" y="1332.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">raise tokens of + attempts</text>
<text x="300.0" y="1362.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">lower tokens of − attempts</text>
<text x="300.0" y="1392.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">penalty for drifting</text>
<rect x="36" y="1448" width="528" height="318" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1492" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1532" font-family="Chalkboard SE" font-size="21" fill="#374151">• No value model: the group is the baseline</text>
<text x="62" y="1572" font-family="Chalkboard SE" font-size="21" fill="#374151">• All 8 wrong (or all right): every advantage</text>
<text x="77" y="1602" font-family="Chalkboard SE" font-size="21" fill="#374151">0</text>
<text x="62" y="1642" font-family="Chalkboard SE" font-size="21" fill="#374151">• Signal comes from problems at the edge of</text>
<text x="77" y="1672" font-family="Chalkboard SE" font-size="21" fill="#374151">ability</text>
<text x="62" y="1712" font-family="Chalkboard SE" font-size="21" fill="#374151">• Long reasoning emerges because it raises</text>
<text x="77" y="1742" font-family="Chalkboard SE" font-size="21" fill="#374151">success</text>
