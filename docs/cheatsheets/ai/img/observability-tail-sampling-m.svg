<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1380" viewBox="0 0 600 1380">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1380" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">DECIDE AFTER THE TRACE ENDS</text>
<path d="M30.0,76 Q300.0,92 570.0,74" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="214.0" x2="300.0" y2="294.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<path d="M481.4921875,171.0 L582,171.0 L582,732.0 L478.96875,732.0" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="416.0" x2="300.0" y2="496.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<line x1="300.0" y1="790.0" x2="300.0" y2="870.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="118.5078125" y="128.0" width="362.984375" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="168.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">200,000 conversations a day</text>
<text x="300.0" y="198.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">≈125 KB per trace = 25 GB a day</text>
<rect x="139.5234375" y="300.0" width="320.953125" height="116" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="340.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Head sampling</text>
<text x="300.0" y="370.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">decide when the request starts:</text>
<text x="300.0" y="400.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">keep 5% at random</text>
<rect x="125.5" y="502.0" width="349.0" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="542.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Blind</text>
<text x="300.0" y="572.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">throws away 95% of the errors too</text>
<rect x="129.03125" y="674.0" width="341.9375" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="714.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Tail sampling</text>
<text x="300.0" y="744.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">buffer each trace until it finishes,</text>
<text x="300.0" y="774.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">then decide with full knowledge</text>
<rect x="120.9921875" y="876.0" width="358.015625" height="146" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="916.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Keeps ≈10%: 2.6 GB a day</text>
<text x="300.0" y="946.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">every error 2% · thumbs-down 1.5%</text>
<text x="300.0" y="976.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">over 20 s 2.4%</text>
<text x="300.0" y="1006.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">+ 5% of the rest as a baseline</text>
<rect x="36" y="1062" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1106" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1146" font-family="Chalkboard SE" font-size="21" fill="#374151">• Metrics come from all traffic, before</text>
<text x="77" y="1176" font-family="Chalkboard SE" font-size="21" fill="#374151">sampling</text>
<text x="62" y="1216" font-family="Chalkboard SE" font-size="21" fill="#374151">• System prompt: store version + hash</text>
<text x="62" y="1256" font-family="Chalkboard SE" font-size="21" fill="#374151">• Metrics a year, traces weeks, raw prompts</text>
<text x="77" y="1286" font-family="Chalkboard SE" font-size="21" fill="#374151">days</text>
<text x="62" y="1326" font-family="Chalkboard SE" font-size="21" fill="#374151">• Redact personal data at the source</text>
</svg>