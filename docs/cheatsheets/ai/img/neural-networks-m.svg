<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2524" viewBox="0 0 600 2524">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="2524" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">FORWARD, BACKWARD, AND</text>
<text x="300.0" y="106" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">THE TRICKS THAT MAKE IT</text>
<text x="300.0" y="154" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">TRAIN</text>
<path d="M39.1328125,172 Q300.0,188 560.8671875,170" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="318.0" x2="300.0" y2="398.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="490.0" x2="300.0" y2="570.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="662.0" x2="300.0" y2="742.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="834.0" x2="300.0" y2="914.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="976.0" x2="300.0" y2="1094.0" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah-red)"/>
<rect x="252.0" y="1006.0" width="96.0" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="1028.0" font-family="Chalkboard SE" font-size="19" fill="#dc2626" text-anchor="middle">backward</text>
<line x1="300.0" y1="1156.0" x2="300.0" y2="1236.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<line x1="300.0" y1="1298.0" x2="300.0" y2="1378.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="50" y="204" width="92.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="228" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Forward</text>
<rect x="50" y="1042" width="108.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="1066" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Backward</text>
<rect x="50" y="1536" width="71.03125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="1560" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Tricks</text>
<rect x="210.0" y="262.0" width="180" height="56" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="302.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Input x</text>
<rect x="210.0" y="404.0" width="180" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="444.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Linear</text>
<text x="300.0" y="474.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">Wx + b</text>
<rect x="210.0" y="576.0" width="180" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="616.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Activation</text>
<text x="300.0" y="646.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">ReLU · GELU</text>
<rect x="200.015625" y="748.0" width="199.96875" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="788.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">× many layers</text>
<text x="300.0" y="818.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">+ residual + norm</text>
<rect x="209.515625" y="920.0" width="180.96875" height="56" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="960.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Logits → loss</text>
<rect x="184.015625" y="1100.0" width="231.96875" height="56" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1140.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">∂L/∂x = W^T · δ</text>
<rect x="184.0" y="1242.0" width="232.0" height="56" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1282.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">∂L/∂W = δ · x^T</text>
<rect x="192.9921875" y="1384.0" width="214.015625" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1424.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">AdamW step</text>
<text x="300.0" y="1454.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">warmup + cosine LR</text>
<rect x="210.0" y="1594.0" width="180" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1634.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Init</text>
<text x="300.0" y="1664.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">He / Xavier</text>
<rect x="149.5" y="1766.0" width="301.0" height="56" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1806.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">LayerNorm / RMSNorm</text>
<rect x="210.0" y="1908.0" width="180" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1948.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Residual</text>
<text x="300.0" y="1978.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">x + F(x)</text>
<rect x="146.0" y="2080.0" width="308.0" height="56" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="2120.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Dropout · weight decay</text>
<rect x="36" y="2176" width="528" height="318" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="2220" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="2260" font-family="Chalkboard SE" font-size="21" fill="#374151">• Without nonlinearity, depth collapses to</text>
<text x="77" y="2290" font-family="Chalkboard SE" font-size="21" fill="#374151">one layer</text>
<text x="62" y="2330" font-family="Chalkboard SE" font-size="21" fill="#374151">• Activations are saved for backward:</text>
<text x="77" y="2360" font-family="Chalkboard SE" font-size="21" fill="#374151">memory ∝ batch × depth</text>
<text x="62" y="2400" font-family="Chalkboard SE" font-size="21" fill="#374151">• Gradients accumulate: zero_grad() every</text>
<text x="77" y="2430" font-family="Chalkboard SE" font-size="21" fill="#374151">step</text>
<text x="62" y="2470" font-family="Chalkboard SE" font-size="21" fill="#374151">• Residuals give gradients an identity path</text>
</svg>