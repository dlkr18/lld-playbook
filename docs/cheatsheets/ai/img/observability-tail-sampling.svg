<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="976" viewBox="0 0 2140 976">
<defs>
<marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker>
<marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker>
<marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker>
</defs>
<rect width="2140" height="976" fill="#ffffff"/>
<text x="1070.0" y="70" font-family="Marker Felt" font-size="46" fill="#1e40af" text-anchor="middle" font-weight="bold">DECIDE AFTER THE TRACE ENDS</text>
<path d="M743.8125,88 Q1070.0,106 1396.1875,86" stroke="#1e40af" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<line x1="976.606334841629" y1="236.0" x2="767.9156332158519" y2="343.25731409138774" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="1163.393665158371" y1="236.0" x2="1372.0843667841482" y2="343.25731409138774" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="640.0" y1="472.0" x2="640.0" y2="591.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<line x1="1500.0" y1="472.0" x2="1500.0" y2="576.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="882.5078125" y="140.0" width="374.984375" height="96" rx="16" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="1070.0" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">200,000 conversations a day</text>
<text x="1070.0" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">≈125 KB per trace = 25 GB a day</text>
<rect x="360.0" y="346.0" width="560" height="126" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="640.0" y="390.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Head sampling</text>
<text x="640.0" y="420.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">decide when the request starts:</text>
<text x="640.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">keep 5% at random</text>
<rect x="1220.0" y="346.0" width="560" height="126" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="1500.0" y="390.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Tail sampling</text>
<text x="1500.0" y="420.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">buffer each trace until it finishes,</text>
<text x="1500.0" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">then decide with full knowledge</text>
<rect x="360.0" y="597.0" width="560" height="96" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="640.0" y="641.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Blind</text>
<text x="640.0" y="671.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">throws away 95% of the errors too</text>
<rect x="1220.0" y="582.0" width="560" height="126" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="1500.0" y="626.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Keeps ≈10%: 2.6 GB a day</text>
<text x="1500.0" y="656.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">every error 2% · thumbs-down 1.5% · over 20 s 2.4%</text>
<text x="1500.0" y="686.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">+ 5% of the rest as a baseline</text>
<rect x="60" y="778" width="2020" height="158" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="96" y="824" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="870" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Metrics come from all traffic, before sampling</text>
<text x="1070.0" y="870" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; System prompt: store version + hash</text>
<text x="96.0" y="914" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Metrics a year, traces weeks, raw prompts days</text>
<text x="1070.0" y="914" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Redact personal data at the source</text>
</svg>