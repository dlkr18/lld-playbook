<text x="62" y="1458" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1498" font-family="Chalkboard SE" font-size="21" fill="#374151">• DPO: no reward model, no RL loop</text>
<text x="62" y="1538" font-family="Chalkboard SE" font-size="21" fill="#374151">• β controls how far from the reference</text>
<text x="62" y="1578" font-family="Chalkboard SE" font-size="21" fill="#374151">• KTO: thumbs up/down only</text>
<text x="77" y="1608" font-family="Chalkboard SE" font-size="21" fill="#374151">IPO: bounded loss</text>
<text x="62" y="1648" font-family="Chalkboard SE" font-size="21" fill="#374151">• ORPO: preference folded into SFT</text>
