<text x="56" y="922" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Outcome</text>
<rect x="87.5078125" y="214.0" width="424.984375" height="146" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Vector search</text>
<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">P1 cushion kit 0.86 · P2 XM5 ear pads 0.81</text>
<text x="300.0" y="314.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">P3 XM4 headphones 0.78</text>
<text x="300.0" y="344.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">P4 universal pads 0.74</text>
<rect x="154.515625" y="446.0" width="290.96875" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="486.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">BM25 keyword search</text>
<text x="300.0" y="516.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">P2 9.4 · P3 6.1</text>
<text x="300.0" y="546.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">P5 XM5 carrying case 5.2</text>
<rect x="70.03125" y="686.0" width="459.9375" height="146" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="726.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Fuse the two lists</text>
<text x="300.0" y="756.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">relative score: min-max each list to 0-1, s = α·v</text>
<text x="300.0" y="786.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">+ (1 − α)·k</text>
<text x="300.0" y="816.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">ranked: 1/(60 + rank) from each list</text>
<rect x="173.515625" y="956.0" width="252.96875" height="116" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="996.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Relative, α = 0.75</text>
<text x="300.0" y="1026.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">P1 0.75 beats P2 0.688</text>
<text x="300.0" y="1056.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">generic kit wins</text>
<rect x="179.015625" y="1158.0" width="241.96875" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1198.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Relative, α = 0.5</text>
<text x="300.0" y="1228.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">P2 0.792 beats P1 0.5</text>
<text x="300.0" y="1258.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">exact product wins</text>
<rect x="123.0234375" y="1360.0" width="353.953125" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1400.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Ranked fusion</text>
<text x="300.0" y="1430.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">P2 0.0325 · P3 0.0320 · P1 0.0164</text>
<text x="300.0" y="1460.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">wrong model comes second</text>
<rect x="36" y="1516" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1560" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1600" font-family="Chalkboard SE" font-size="21" fill="#374151">• α is a product decision: tune by query type</text>
<text x="62" y="1640" font-family="Chalkboard SE" font-size="21" fill="#374151">• Min-max is per query: scores not</text>
<text x="77" y="1670" font-family="Chalkboard SE" font-size="21" fill="#374151">comparable</text>
<text x="62" y="1710" font-family="Chalkboard SE" font-size="21" fill="#374151">• Ranked fusion rewards being in both lists</text>
<text x="62" y="1750" font-family="Chalkboard SE" font-size="21" fill="#374151">• A reranker over the top 30-50 adds</text>
<text x="77" y="1780" font-family="Chalkboard SE" font-size="21" fill="#374151">judgement</text>
</svg>