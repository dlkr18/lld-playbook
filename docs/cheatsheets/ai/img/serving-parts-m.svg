<text x="62" y="1436" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1476" font-family="Chalkboard SE" font-size="21" fill="#374151">• Route on outstanding tokens, not request</text>
<text x="77" y="1506" font-family="Chalkboard SE" font-size="21" fill="#374151">count</text>
<text x="62" y="1546" font-family="Chalkboard SE" font-size="21" fill="#374151">• Prefix affinity reuses a conversation's KV</text>
<text x="77" y="1576" font-family="Chalkboard SE" font-size="21" fill="#374151">cache</text>
<text x="62" y="1616" font-family="Chalkboard SE" font-size="21" fill="#374151">• Engines are stateful: drain before a deploy</text>
<text x="62" y="1656" font-family="Chalkboard SE" font-size="21" fill="#374151">• Scale on queue depth, KV usage and p95</text>
<text x="77" y="1686" font-family="Chalkboard SE" font-size="21" fill="#374151">TTFT</text>
