<text x="96" y="558" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="604" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Latency is won by overlap, not faster parts</text>
<text x="1070.0" y="604" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Streamed ≈ 1,070 ms; speculative ≈ 720 ms</text>
<text x="96.0" y="648" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Barge-in also cancels the in-flight LLM</text>
<text x="1070.0" y="648" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; History keeps only what the caller heard</text>
