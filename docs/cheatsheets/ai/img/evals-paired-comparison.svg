<text x="1483.3333333333335" y="626.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">d = (42 − 18) / 600</text>
<text x="1483.3333333333335" y="656.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">= +4.0 points</text>
