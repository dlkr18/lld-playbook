<text x="300.0" y="778.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">576 visual tokens</text>
<text x="300.0" y="808.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">for the receipt</text>
