<text x="300.0" y="1092.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">User text tokens</text>
<text x="300.0" y="1122.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">"Extract the receipt..."</text>
<rect x="107.015625" y="1262.0" width="385.96875" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1302.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">LLM</text>
<text x="300.0" y="1332.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one sequence, attends to every position</text>
<rect x="36" y="1388" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1432" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1472" font-family="Chalkboard SE" font-size="21" fill="#374151">• To the LLM the image is 576 more positions</text>
<text x="62" y="1512" font-family="Chalkboard SE" font-size="21" fill="#374151">• Stage 1: train only the projector</text>
<text x="62" y="1552" font-family="Chalkboard SE" font-size="21" fill="#374151">• Stage 2: unfreeze the LLM,</text>
<text x="77" y="1582" font-family="Chalkboard SE" font-size="21" fill="#374151">instruction-tune</text>
<text x="62" y="1622" font-family="Chalkboard SE" font-size="21" fill="#374151">• Compress: 2 × 2 merge or a resampler (e.g.</text>
<text x="77" y="1652" font-family="Chalkboard SE" font-size="21" fill="#374151">64)</text>
</svg>