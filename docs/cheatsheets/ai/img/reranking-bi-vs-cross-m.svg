<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">embedded once, before</text>
<text x="300.0" y="314.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">any query exists</text>
<rect x="175.015625" y="416.0" width="249.96875" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="456.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Dot product</text>
<text x="300.0" y="486.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">d1, d2, d5 ranked close:</text>
<text x="300.0" y="516.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">all "invoice export"</text>
