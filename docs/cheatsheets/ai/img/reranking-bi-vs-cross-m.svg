<text x="300.0" y="1070.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">"E-4012" attends to "E-4012"</text>
<text x="300.0" y="1100.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">spots "E-4007" as different</text>
<rect x="160.5390625" y="1202.0" width="278.921875" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="1242.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">[CLS] → linear → logit</text>
<text x="300.0" y="1272.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">sigmoid → 0 to 1</text>
<rect x="210.0" y="1374.0" width="180" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1414.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">New order</text>
<text x="300.0" y="1444.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">d1, d5, d2</text>
<rect x="36" y="1500" width="528" height="318" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1544" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1584" font-family="Chalkboard SE" font-size="21" fill="#374151">• 50 pairs × 320 tokens = 16,000 tokens, one</text>
<text x="77" y="1614" font-family="Chalkboard SE" font-size="21" fill="#374151">batch</text>
<text x="62" y="1654" font-family="Chalkboard SE" font-size="21" fill="#374151">• All 30,000 chunks: ≈9.6M tokens per</text>
<text x="77" y="1684" font-family="Chalkboard SE" font-size="21" fill="#374151">question</text>
<text x="62" y="1724" font-family="Chalkboard SE" font-size="21" fill="#374151">• Nothing to precompute: one pass per pair</text>
<text x="62" y="1764" font-family="Chalkboard SE" font-size="21" fill="#374151">• It only reorders: ceiling = first-stage</text>
<text x="77" y="1794" font-family="Chalkboard SE" font-size="21" fill="#374151">recall@N</text>
</svg>