<text x="300.0" y="868.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">One input</text>
<text x="300.0" y="898.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">[CLS] query [SEP] passage [SEP]</text>
<rect x="144.546875" y="1000.0" width="310.90625" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
