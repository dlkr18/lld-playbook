<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1444" viewBox="0 0 600 1444">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1444" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">THE WINDOW IS THE ONLY</text>
<text x="300.0" y="106" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">MEMORY</text>
<path d="M60.4296875,124 Q300.0,140 539.5703125,122" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="269.126953125" y1="682.0" x2="210.8801937146849" y2="763.1261248293475" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah-teal)"/>
<rect x="201.25390625" y="693.0" width="74.0" height="30" rx="6" fill="#ffffff"/>
<text x="238.25390625" y="715.0" font-family="Chalkboard SE" font-size="19" fill="#0f766e" text-anchor="middle">read in</text>
<line x1="300.0" y1="472.0" x2="300.0" y2="590.0" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah-teal)"/>
<rect x="252.5234375" y="502.0" width="94.953125" height="30" rx="6" fill="#ffffff"/>
<text x="300.0" y="524.0" font-family="Chalkboard SE" font-size="19" fill="#0f766e" text-anchor="middle">write out</text>
<rect x="50" y="156" width="148.125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="180" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">One model call</text>
<rect x="50" y="538" width="84.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="562" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Outside</text>
<rect x="71.5234375" y="214.0" width="220.953125" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="182.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">System</text>
<text x="182.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">role · rules · policies</text>
<rect x="348.4765625" y="214.0" width="180" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="438.4765625" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Tools</text>
<text x="438.4765625" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">fixed per agent</text>
<rect x="197.4921875" y="386.0" width="205.015625" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="426.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Conversation</text>
<text x="300.0" y="456.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">user + model turns</text>
<rect x="188.015625" y="596.0" width="223.96875" height="86" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="300.0" y="636.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Long-term store</text>
<text x="300.0" y="666.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">outside the window</text>
<rect x="72.515625" y="768.0" width="207.984375" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="176.5078125" y="808.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Memories</text>
<text x="176.5078125" y="838.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">this user + request</text>
<rect x="336.5" y="768.0" width="190.984375" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="431.9921875" y="808.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Tool results</text>
<text x="431.9921875" y="838.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">grows every step</text>
<rect x="208.0" y="940.0" width="184.0" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="980.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Output room</text>
<text x="300.0" y="1010.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">reserved, empty</text>
<rect x="36" y="1066" width="528" height="348" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1110" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1150" font-family="Chalkboard SE" font-size="21" fill="#374151">• Not in the window = the model cannot know</text>
<text x="77" y="1180" font-family="Chalkboard SE" font-size="21" fill="#374151">it</text>
<text x="62" y="1220" font-family="Chalkboard SE" font-size="21" fill="#374151">• Working memory: what stays in the</text>
<text x="77" y="1250" font-family="Chalkboard SE" font-size="21" fill="#374151">message list</text>
<text x="62" y="1290" font-family="Chalkboard SE" font-size="21" fill="#374151">• Long-term memory: what you write out and</text>
<text x="77" y="1320" font-family="Chalkboard SE" font-size="21" fill="#374151">read back</text>
<text x="62" y="1360" font-family="Chalkboard SE" font-size="21" fill="#374151">• Memory is a read path and a write path</text>
<text x="77" y="1390" font-family="Chalkboard SE" font-size="21" fill="#374151">you design</text>
</svg>