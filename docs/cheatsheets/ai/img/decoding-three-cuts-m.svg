<text x="56" y="132" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Distribution</text>
<rect x="50" y="348" width="45.03125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="372" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Cut</text>
<rect x="50" y="588" width="134.09375" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="612" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Sample from</text>
<rect x="65.015625" y="166.0" width="469.96875" height="116" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="206.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">T = 1, sorted by probability</text>
<text x="300.0" y="236.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">Paris 0.628 · the 0.155 · a 0.104 · France 0.057</text>
<text x="300.0" y="266.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">Lyon 0.031 · beautiful 0.021 · banana 0.004</text>
<rect x="180.5390625" y="406.0" width="238.921875" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="446.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Top-k, k = 3</text>
<text x="300.0" y="476.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">keep the 3 most likely</text>
<text x="300.0" y="506.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">they hold 0.887</text>
<rect x="152.515625" y="646.0" width="294.96875" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="686.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">3 tokens, renormalised</text>
<text x="300.0" y="716.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">Paris 0.708 · the 0.175</text>
<text x="300.0" y="746.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">a 0.117</text>
<rect x="100.0703125" y="848.0" width="399.859375" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="888.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Top-p, p = 0.9</text>
<text x="300.0" y="918.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">running total 0.628, 0.783, 0.887, 0.944</text>
<text x="300.0" y="948.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">France is needed to pass 0.9</text>
<rect x="152.515625" y="1050.0" width="294.96875" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1090.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">4 tokens, renormalised</text>
<text x="300.0" y="1120.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">Paris 0.666 · the 0.164</text>
<text x="300.0" y="1150.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">a 0.110 · France 0.060</text>
<rect x="150.0078125" y="1252.0" width="299.984375" height="116" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="300.0" y="1292.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Min-p, m = 0.1</text>
<text x="300.0" y="1322.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">keep p ≥ 0.1 × 0.628 = 0.063</text>
<text x="300.0" y="1352.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">France (0.057) is cut</text>
<rect x="160.015625" y="1454.0" width="279.96875" height="116" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="300.0" y="1494.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">3 tokens</text>
<text x="300.0" y="1524.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">Paris · the · a</text>
<text x="300.0" y="1554.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">the same set as top-k here</text>
<rect x="36" y="1610" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1654" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1694" font-family="Chalkboard SE" font-size="21" fill="#374151">• Top-k: a fixed count, blind to confidence</text>
<text x="62" y="1734" font-family="Chalkboard SE" font-size="21" fill="#374151">• Top-p and min-p shrink when the model is</text>
<text x="77" y="1764" font-family="Chalkboard SE" font-size="21" fill="#374151">sure</text>
<text x="62" y="1804" font-family="Chalkboard SE" font-size="21" fill="#374151">• 95% sure of Paris: the nucleus is one token</text>
<text x="62" y="1844" font-family="Chalkboard SE" font-size="21" fill="#374151">• Min-p holds up better at high temperature</text>
</svg>