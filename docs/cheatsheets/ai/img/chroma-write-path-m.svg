<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1718" viewBox="0 0 600 1718">
<defs><marker id="ah-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#ea580c"/></marker><marker id="ah-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#7e22ce"/></marker><marker id="ah-pink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#dc2626"/></marker><marker id="ah-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-teal" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="600" height="1718" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">WHAT AN UPSERT DOES</text>
<path d="M82.453125,76 Q300.0,92 517.546875,74" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
<line x1="300.0" y1="282.0" x2="300.0" y2="362.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="484.0" x2="300.0" y2="564.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="686.0" x2="300.0" y2="766.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="888.0" x2="300.0" y2="1006.0" stroke="#0f766e" stroke-width="3" marker-end="url(#ah-teal)"/>
<path d="M390.0,830.0 L582,830.0 L582,1287.0 L459.484375,1287.0" stroke="#16a34a" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<rect x="50" y="108" width="46.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="132" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Call</text>
<rect x="50" y="954" width="69.03125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="978" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Apply</text>
<rect x="178.5390625" y="166.0" width="242.921875" height="116" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="206.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">upsert()</text>
<text x="300.0" y="236.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">ids · embeddings</text>
<text x="300.0" y="266.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">documents · metadatas</text>
<rect x="203.03125" y="368.0" width="193.9375" height="116" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="408.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Embed</text>
<text x="300.0" y="438.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">only if no vectors</text>
<text x="300.0" y="468.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">were given</text>
<rect x="196.5" y="570.0" width="207.0" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="610.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Validate</text>
<text x="300.0" y="640.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">dimensions match</text>
<text x="300.0" y="670.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">ids unique in batch</text>
<rect x="210.0" y="772.0" width="180" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="812.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Write log</text>
<text x="300.0" y="842.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">SQLite</text>
<text x="300.0" y="872.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">durable record</text>
<rect x="120.5078125" y="1012.0" width="358.984375" height="116" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="300.0" y="1052.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Metadata segment (SQLite)</text>
<text x="300.0" y="1082.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">ids · metadata · document text</text>
<text x="300.0" y="1112.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">full-text index for where_document</text>
<rect x="148.515625" y="1214.0" width="302.96875" height="146" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1254.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Vector segment</text>
<text x="300.0" y="1284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">small exact buffer</text>
<text x="300.0" y="1314.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">merged into HNSW in batches</text>
<text x="300.0" y="1344.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">graph files saved periodically</text>
<rect x="36" y="1400" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1444" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1484" font-family="Chalkboard SE" font-size="21" fill="#374151">• Batch writes: every call pays fixed</text>
<text x="77" y="1514" font-family="Chalkboard SE" font-size="21" fill="#374151">overhead</text>
<text x="62" y="1554" font-family="Chalkboard SE" font-size="21" fill="#374151">• Deletes are tombstones until a rebuild</text>
<text x="62" y="1594" font-family="Chalkboard SE" font-size="21" fill="#374151">• The HNSW graph must be loaded into RAM</text>
<text x="62" y="1634" font-family="Chalkboard SE" font-size="21" fill="#374151">• Heavy churn? build a fresh collection,</text>
<text x="77" y="1664" font-family="Chalkboard SE" font-size="21" fill="#374151">switch</text>
</svg>