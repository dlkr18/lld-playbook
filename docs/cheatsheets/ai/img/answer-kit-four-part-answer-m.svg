<line x1="300.0" y1="472.0" x2="300.0" y2="552.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="644.0" x2="300.0" y2="724.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<path d="M402.9765625,257.0 L582,257.0 L582,1604.0 L444.484375,1604.0" stroke="#2563eb" stroke-width="3" fill="none" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ah-blue)"/>
<path d="M390.0,429.0 L567,429.0 L567,1402.0 L468.0,1402.0" stroke="#7e22ce" stroke-width="3" fill="none" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ah-purple)"/>
<path d="M424.4609375,601.0 L552,601.0 L552,1200.0 L448.5,1200.0" stroke="#ea580c" stroke-width="3" fill="none" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#ah-orange)"/>
<line x1="300.0" y1="816.0" x2="300.0" y2="934.0" stroke="#16a34a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah-green)"/>
<rect x="50" y="156" width="70.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="180" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Shape</text>
<rect x="50" y="882" width="143.140625" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="906" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Agent looping</text>
<rect x="197.0234375" y="214.0" width="205.953125" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Claim</text>
<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one sentence, first</text>
<rect x="210.0" y="386.0" width="180" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="426.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Mechanism</text>
<text x="300.0" y="456.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">why it works</text>
<rect x="175.5390625" y="558.0" width="248.921875" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="598.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Trade-off</text>
<text x="300.0" y="628.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">what it costs, when not</text>
<rect x="175.015625" y="730.0" width="249.96875" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="770.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Example</text>
<text x="300.0" y="800.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one system, one number</text>
<rect x="179.03125" y="940.0" width="241.9375" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="980.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Idempotency key:</text>
<text x="300.0" y="1010.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">≈24 double refunds</text>
<text x="300.0" y="1040.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">a month removed</text>
<rect x="159.5" y="1142.0" width="281.0" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1182.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Approvals above $50:</text>
<text x="300.0" y="1212.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">27 a day × 30 s</text>
<text x="300.0" y="1242.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">= 13.5 minutes</text>
<rect x="140.0" y="1344.0" width="320.0" height="116" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="1384.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Steps compound at 97%:</text>
<text x="300.0" y="1414.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">3 steps 0.91</text>
<text x="300.0" y="1444.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">6 steps 0.83</text>
<rect x="163.515625" y="1546.0" width="272.96875" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="1586.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Budgets, policy code</text>
<text x="300.0" y="1616.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">idempotency, a human</text>
<text x="300.0" y="1646.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">for the risky tail</text>
<rect x="36" y="1702" width="528" height="228" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1746" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1786" font-family="Chalkboard SE" font-size="21" fill="#374151">• Lead with the claim: graders decide early</text>
<text x="62" y="1826" font-family="Chalkboard SE" font-size="21" fill="#374151">• No trade-off sounds like a blog post</text>
<text x="62" y="1866" font-family="Chalkboard SE" font-size="21" fill="#374151">• Then stop and let them probe</text>
<text x="62" y="1906" font-family="Chalkboard SE" font-size="21" fill="#374151">• Follow-ups decide the level</text>
</svg>