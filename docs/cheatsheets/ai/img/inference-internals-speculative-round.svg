<rect x="820.6549258474577" y="286.4427777777778" width="114.015625" height="30" rx="6" fill="#ffffff"/>
<text x="877.6627383474577" y="308.4427777777778" font-family="Chalkboard SE" font-size="19" fill="#1f2937" text-anchor="middle">next round</text>
<rect x="464.5390625" y="140.0" width="275.9375" height="126" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="602.5078125" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Drafter</text>
<text x="602.5078125" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">proposes k = 4 tokens</text>
<text x="602.5078125" y="244.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">5% of a target step each</text>
<rect x="955.015625" y="140.0" width="335.984375" height="126" rx="16" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="1123.0078125" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Target model</text>
<text x="1123.0078125" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">scores all 4 positions in one pass</text>
<text x="1123.0078125" y="244.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">costs about one decode step</text>
<rect x="1505.5390625" y="155.0" width="359.921875" height="96" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="1685.5" y="199.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Check each draft in order</text>
<text x="1685.5" y="229.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">accept with probability min(1, p/q)</text>
<rect x="990.5390625" y="376.0" width="348.9375" height="126" rx="16" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="1165.0078125" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Emit</text>
<text x="1165.0078125" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">the accepted drafts</text>
<text x="1165.0078125" y="480.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">+ one replacement or bonus token</text>
<rect x="1559.74609375" y="376.0" width="299.984375" height="126" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1709.73828125" y="420.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">First rejection</text>
<text x="1709.73828125" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">drop the rest of the draft</text>
<text x="1709.73828125" y="480.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">resample from max(0, p − q)</text>
<rect x="60" y="572" width="2020" height="158" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="96" y="618" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="664" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; α = 0.8, k = 4: 3.36 tokens per target pass</text>
<text x="1070.0" y="664" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Round costs 1 + 4 × 0.05 = 1.2 steps: ≈ 2.8×</text>
<text x="96.0" y="708" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; α = 0.5: 1.6× · α = 0.3: 1.2×</text>
<text x="1070.0" y="708" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Same output as the target; gain shrinks at big batch</text>
</svg>