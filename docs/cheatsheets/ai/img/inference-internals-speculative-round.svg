<rect x="1393.3105965307204" y="281.5" width="96.96875" height="30" rx="6" fill="#ffffff"/>
<text x="1441.7949715307204" y="303.5" font-family="Chalkboard SE" font-size="19" fill="#16a34a" text-anchor="middle">accepted</text>
<line x1="1690.4298199152543" y1="251.0" x2="1702.6548896889951" y2="370.0313965270481" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<line x1="1559.74609375" y1="439.0" x2="1345.4765625" y2="439.0" stroke="#dc2626" stroke-width="3" marker-end="url(#ah-red)"/>
<rect x="1386.626953125" y="407.0" width="125.96875" height="30" rx="6" fill="#ffffff"/>
<text x="1449.611328125" y="429.0" font-family="Chalkboard SE" font-size="19" fill="#dc2626" text-anchor="middle">replacement</text>
