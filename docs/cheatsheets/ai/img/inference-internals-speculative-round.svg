<text x="847.74609375" y="193.0" font-family="Chalkboard SE" font-size="19" fill="#2563eb" text-anchor="middle">4 drafts</text>
<line x1="1291.0" y1="203.0" x2="1499.5390625" y2="203.0" stroke="#7e22ce" stroke-width="3" marker-end="url(#ah-purple)"/>
