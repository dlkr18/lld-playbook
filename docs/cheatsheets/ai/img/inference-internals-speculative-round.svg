<rect width="2140" height="770" fill="#ffffff"/>
<text x="1070.0" y="70" font-family="Marker Felt" font-size="46" fill="#1e40af" text-anchor="middle" font-weight="bold">ONE ROUND OF SPECULATIVE DECODING</text>
<path d="M666.3671875,88 Q1070.0,106 1473.6328125,86" stroke="#1e40af" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="70" y="211.0" font-family="Marker Felt" font-size="24" fill="#6b7280" font-weight="bold">Propose + verify</text>
<text x="70" y="447.0" font-family="Marker Felt" font-size="24" fill="#6b7280" font-weight="bold">Result</text>
<line x1="740.4765625" y1="203.0" x2="949.015625" y2="203.0" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)"/>
