<text x="300.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Data parallel</text>
<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">copy model, split batch</text>
<rect x="162.9921875" y="424.0" width="274.015625" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="464.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">All-reduce gradients</text>
<text x="300.0" y="494.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">NCCL</text>
<rect x="164.5234375" y="596.0" width="270.953125" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="636.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">ZeRO / FSDP</text>
<text x="300.0" y="666.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">shard params · grads · opt</text>
<rect x="177.015625" y="768.0" width="245.96875" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="808.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">All-gather params</text>
<text x="300.0" y="838.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">on demand</text>
<rect x="195.0390625" y="940.0" width="209.921875" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="980.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Tensor parallel</text>
<text x="300.0" y="1010.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">split each matmul</text>
<rect x="202.9921875" y="1112.0" width="194.015625" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1152.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Needs NVLink</text>
<text x="300.0" y="1182.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">within a node</text>
<rect x="189.0234375" y="1284.0" width="221.953125" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1324.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Pipeline parallel</text>
<text x="300.0" y="1354.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">split the layers</text>
<rect x="199.015625" y="1456.0" width="201.96875" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1496.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Micro-batches</text>
<text x="300.0" y="1526.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">hide the bubble</text>
<rect x="171.015625" y="1666.0" width="257.96875" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="1706.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">SMs + tensor cores</text>
<text x="300.0" y="1736.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">compute</text>
<rect x="197.46875" y="1838.0" width="205.0625" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="1878.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">HBM</text>
<text x="300.0" y="1908.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">memory bandwidth</text>
<rect x="36" y="1964" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="2008" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="2048" font-family="Chalkboard SE" font-size="21" fill="#374151">• Low arithmetic intensity = memory-bound</text>
<text x="62" y="2088" font-family="Chalkboard SE" font-size="21" fill="#374151">• FSDP: 16 B/param ÷ number of GPUs</text>
<text x="62" y="2128" font-family="Chalkboard SE" font-size="21" fill="#374151">• Tensor parallel inside a node, data parallel</text>
<text x="77" y="2158" font-family="Chalkboard SE" font-size="21" fill="#374151">across</text>
<text x="62" y="2198" font-family="Chalkboard SE" font-size="21" fill="#374151">• Checkpoint often: failures are routine at</text>
<text x="77" y="2228" font-family="Chalkboard SE" font-size="21" fill="#374151">scale</text>
