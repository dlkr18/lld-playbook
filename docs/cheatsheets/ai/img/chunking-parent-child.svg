<text x="634.984375" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Parent: a section</text>
<text x="634.984375" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">"Enterprise plans", up to ≈1,000 tokens</text>
<rect x="1019.96875" y="140.0" width="371.953125" height="96" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="1205.9453125" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Children: 100 to 200 tokens</text>
<text x="1205.9453125" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">each stores its parent's ID</text>
<rect x="1576.9609375" y="140.0" width="318.0" height="96" rx="16" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="1735.9609375" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Index the children only</text>
<text x="1735.9609375" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">embed + vector index</text>
<rect x="344.21875" y="361.0" width="394.984375" height="96" rx="16" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="541.7109375" y="405.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">"Can enterprise customers get</text>
<text x="541.7109375" y="435.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">a refund after 30 days?"</text>
<rect x="833.421875" y="346.0" width="336.90625" height="126" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1001.875" y="390.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Search the children</text>
<text x="1001.875" y="420.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">best: "...may request a prorated</text>
<text x="1001.875" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">refund within 60 days..."</text>
<rect x="1264.546875" y="361.0" width="300.96875" height="96" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="1415.03125" y="405.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Swap child for parent</text>
<text x="1415.03125" y="435.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one copy per shared parent</text>
<rect x="1659.734375" y="346.0" width="326.046875" height="126" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
