<text x="1822.7578125" y="420.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">incl. "After that, the</text>
<text x="1822.7578125" y="450.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">contract terms apply."</text>
<rect x="60" y="542" width="2020" height="158" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="96" y="588" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="634" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Matching wants small text; answering wants context</text>
<text x="1070.0" y="634" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Cost: 5 parents × 800 tokens = 4,000 prompt tokens</text>
<text x="96.0" y="678" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Lighter variant: matched sentence + neighbours</text>
<text x="1070.0" y="678" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Cheaper fix for context: embed the heading path</text>
