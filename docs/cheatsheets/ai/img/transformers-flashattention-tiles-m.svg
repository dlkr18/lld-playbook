<rect x="36" y="1500" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1544" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1584" font-family="Chalkboard SE" font-size="21" fill="#374151">• T = 32,768: 2.1 GB per head, 69 GB per</text>
<text x="77" y="1614" font-family="Chalkboard SE" font-size="21" fill="#374151">layer</text>
<text x="62" y="1654" font-family="Chalkboard SE" font-size="21" fill="#374151">• Not an approximation: same output</text>
<text x="62" y="1694" font-family="Chalkboard SE" font-size="21" fill="#374151">• Attention memory grows with T, not T × T</text>
<text x="62" y="1734" font-family="Chalkboard SE" font-size="21" fill="#374151">• Faster because less data moves</text>
</svg>