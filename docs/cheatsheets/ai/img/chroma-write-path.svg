<text x="96.0" y="694" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Batch writes: every call pays fixed overhead</text>
<text x="1070.0" y="694" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Deletes are tombstones until a rebuild</text>
<text x="96.0" y="738" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; The HNSW graph must be loaded into RAM</text>
<text x="1070.0" y="738" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Heavy churn? build a fresh collection, switch</text>
