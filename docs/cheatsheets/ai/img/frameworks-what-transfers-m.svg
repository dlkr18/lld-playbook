<text x="62" y="1062" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1102" font-family="Chalkboard SE" font-size="21" fill="#374151">• Leaving = rewriting the orchestration only</text>
