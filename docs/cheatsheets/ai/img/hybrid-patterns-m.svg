<text x="62" y="1686" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1726" font-family="Chalkboard SE" font-size="21" fill="#374151">• Cascades often cut cost 50–80%</text>
<text x="62" y="1766" font-family="Chalkboard SE" font-size="21" fill="#374151">• Tune thresholds on the eval set (like an</text>
<text x="77" y="1796" font-family="Chalkboard SE" font-size="21" fill="#374151">ROC point)</text>
<text x="62" y="1836" font-family="Chalkboard SE" font-size="21" fill="#374151">• LLM labels can train a small fast model</text>
<text x="62" y="1876" font-family="Chalkboard SE" font-size="21" fill="#374151">• Never let the LLM write to the DB directly</text>
