<rect width="2140" height="946" fill="#ffffff"/>
<text x="1070.0" y="70" font-family="Marker Felt" font-size="46" fill="#1e40af" text-anchor="middle" font-weight="bold">ONE MOE LAYER ACROSS GPUS</text>
<path d="M743.9453125,88 Q1070.0,106 1396.0546875,86" stroke="#1e40af" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="70" y="196.0" font-family="Marker Felt" font-size="24" fill="#6b7280" font-weight="bold">Dispatch</text>
<text x="70" y="402.0" font-family="Marker Felt" font-size="24" fill="#6b7280" font-weight="bold">Combine</text>
<text x="70" y="623.0" font-family="Marker Felt" font-size="24" fill="#6b7280" font-weight="bold">Traffic</text>
<line x1="817.48046875" y1="188.0" x2="1036.0078125" y2="188.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="1271.9765625" y1="188.0" x2="1490.50390625" y2="188.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="1677.6184390169904" y1="236.0" x2="1681.150564923726" y2="340.00345718460017" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="1521.4921875" y1="394.0" x2="1291.96875" y2="394.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="921.046875" y1="394.0" x2="691.5234375" y2="394.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<rect x="474.52734375" y="140.0" width="342.953125" height="96" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="646.00390625" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Attention</text>
<text x="646.00390625" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">dense, every GPU, its own tokens</text>
<rect x="1042.0078125" y="140.0" width="229.96875" height="96" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="1156.9921875" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Router</text>
<text x="1156.9921875" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">2 experts per token</text>
<rect x="1496.50390625" y="140.0" width="358.96875" height="96" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1675.98828125" y="184.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">All-to-all #1: dispatch</text>
<text x="1675.98828125" y="214.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">send tokens to their experts' GPUs</text>
<rect x="485.5234375" y="361.0" width="200" height="66" rx="16" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="585.5234375" y="405.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Next layer</text>
<rect x="921.046875" y="346.0" width="364.921875" height="96" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="1103.5078125" y="390.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">All-to-all #2: combine</text>
<text x="1103.5078125" y="420.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">results to home GPU, weight by g_i</text>
<rect x="1521.4921875" y="346.0" width="322.984375" height="96" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="1682.984375" y="390.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Experts</text>
<text x="1682.984375" y="420.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">each GPU runs its own experts</text>
<rect x="615.0" y="552.0" width="1100" height="126" rx="16" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="1165.0" y="596.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Traffic for a batch of 4,096 tokens</text>
<text x="1165.0" y="626.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">one all-to-all: 4,096 tokens × 2 experts × 4,096 wide × 2 bytes = about 67 MB</text>
<text x="1165.0" y="656.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">2 per layer × 32 layers = about 4.3 GB per forward pass</text>
<rect x="60" y="748" width="2020" height="158" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="96" y="794" font-family="Marker Felt" font-size="26" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="96.0" y="840" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Experts 0, 1 on GPU 0; 2, 3 on GPU 1; and so on</text>
<text x="1070.0" y="840" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Keep EP inside one NVLink node</text>
<text x="96.0" y="884" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; A hot expert gets more compute and more traffic</text>
<text x="1070.0" y="884" font-family="Chalkboard SE" font-size="21" fill="#374151">&#8226; Every other GPU waits for the slowest</text>
</svg>