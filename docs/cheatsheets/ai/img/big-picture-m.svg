<text x="300.0" y="811.0" font-family="Chalkboard SE" font-size="19" fill="#7e22ce" text-anchor="middle">as a tool</text>
<path d="M88.0078125,391.0 L18,391.0 L18,1079.0 L111.0390625,1079.0" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="950.0" x2="300.0" y2="1030.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<rect x="182.0078125" y="176.0" width="235.984375" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="216.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Generative model</text>
<text x="300.0" y="246.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">text → next text</text>
<rect x="88.0078125" y="348.0" width="180" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="178.0078125" y="388.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Prompting</text>
<text x="178.0078125" y="418.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">word it well</text>
<rect x="324.0078125" y="348.0" width="187.984375" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="418.0" y="388.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Tools</text>
<text x="418.0" y="418.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">act on the world</text>
<rect x="183.984375" y="520.0" width="232.03125" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="560.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Embedding model</text>
<text x="300.0" y="590.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">text → vector</text>
<rect x="199.515625" y="692.0" width="200.96875" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="732.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">RAG</text>
<text x="300.0" y="762.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">look facts up first</text>
<rect x="210.0" y="864.0" width="180" height="86" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/>
<text x="300.0" y="904.0" font-family="Chalkboard SE" font-size="23" fill="#db2777" text-anchor="middle" font-weight="bold">Agents</text>
<text x="300.0" y="934.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">loop until done</text>
<rect x="119.0390625" y="1036.0" width="361.921875" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="1076.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Production</text>
<text x="300.0" y="1106.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">evals · observability · cost · security</text>
<rect x="36" y="1162" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1206" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1246" font-family="Chalkboard SE" font-size="21" fill="#374151">• The model only sees its context window</text>
<text x="62" y="1286" font-family="Chalkboard SE" font-size="21" fill="#374151">• An agent = model + tools + a loop</text>
<text x="62" y="1326" font-family="Chalkboard SE" font-size="21" fill="#374151">• RAG = search, then paste facts into the</text>
<text x="77" y="1356" font-family="Chalkboard SE" font-size="21" fill="#374151">prompt</text>
<text x="62" y="1396" font-family="Chalkboard SE" font-size="21" fill="#374151">• Multi-agent = several loops cooperating</text>
</svg>