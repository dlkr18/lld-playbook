<text x="62" y="1372" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1412" font-family="Chalkboard SE" font-size="21" fill="#374151">• 16 B = weights 2 + grads 2 + master 4 +</text>
<text x="77" y="1442" font-family="Chalkboard SE" font-size="21" fill="#374151">Adam 8</text>
<text x="62" y="1482" font-family="Chalkboard SE" font-size="21" fill="#374151">• Adapter file ≈ 84 MB vs 16 GB full copy</text>
<text x="62" y="1522" font-family="Chalkboard SE" font-size="21" fill="#374151">• NF4: 6.98B linear params at ≈ 4.13 bits ≈</text>
<text x="77" y="1552" font-family="Chalkboard SE" font-size="21" fill="#374151">3.6 GB</text>
<text x="62" y="1592" font-family="Chalkboard SE" font-size="21" fill="#374151">• + 1.05B embedding/output params in</text>
<text x="77" y="1622" font-family="Chalkboard SE" font-size="21" fill="#374151">16-bit ≈ 2.1 GB</text>
