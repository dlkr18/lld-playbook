<line x1="300.0" y1="768.0" x2="300.0" y2="886.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="978.0" x2="300.0" y2="1058.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
<line x1="300.0" y1="1150.0" x2="300.0" y2="1230.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)"/>
