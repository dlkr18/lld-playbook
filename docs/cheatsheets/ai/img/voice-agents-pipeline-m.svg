<rect width="600" height="1650" fill="#ffffff"/>
<text x="300.0" y="58" font-family="Marker Felt" font-size="40" fill="#1e40af" text-anchor="middle" font-weight="bold">THE CASCADED VOICE PIPELINE</text>
