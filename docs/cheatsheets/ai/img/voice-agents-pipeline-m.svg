<rect x="570" y="656.5234375" width="24" height="174.953125" rx="6" fill="#ffffff"/>
<text x="582" y="744.0" font-family="Chalkboard SE" font-size="19" fill="#dc2626" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 582 744.0)">barge-in: stop TTS</text>
<rect x="50" y="108" width="69.015625" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="132" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Listen</text>
<rect x="50" y="834" width="66.046875" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="858" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Reply</text>
<rect x="203.5078125" y="166.0" width="192.984375" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="206.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Caller audio</text>
<text x="300.0" y="236.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">20–30 ms frames</text>
<rect x="171.53125" y="338.0" width="256.9375" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="378.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">VAD</text>
<text x="300.0" y="408.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">speech or not, per frame</text>
<rect x="193.5078125" y="510.0" width="212.984375" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="550.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Streaming STT</text>
<text x="300.0" y="580.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">final words: 100 ms</text>
<rect x="210.0" y="682.0" width="180" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="722.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Endpointing</text>
<text x="300.0" y="752.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">wait: 300 ms</text>
<rect x="194.5234375" y="892.0" width="210.953125" height="86" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="932.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">LLM (+ tools)</text>
<text x="300.0" y="962.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">first token: 300 ms</text>
<rect x="196.5078125" y="1064.0" width="206.984375" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1104.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">Streaming TTS</text>
<text x="300.0" y="1134.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">first audio: 120 ms</text>
<rect x="197.0234375" y="1236.0" width="205.953125" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="1276.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Caller hears it</text>
<text x="300.0" y="1306.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">+ 150 ms network</text>
<rect x="36" y="1362" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1406" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1446" font-family="Chalkboard SE" font-size="21" fill="#374151">• Latency is won by overlap, not faster parts</text>
<text x="62" y="1486" font-family="Chalkboard SE" font-size="21" fill="#374151">• Streamed ≈ 1,070 ms; speculative ≈ 720</text>
<text x="77" y="1516" font-family="Chalkboard SE" font-size="21" fill="#374151">ms</text>
<text x="62" y="1556" font-family="Chalkboard SE" font-size="21" fill="#374151">• Barge-in also cancels the in-flight LLM</text>
<text x="62" y="1596" font-family="Chalkboard SE" font-size="21" fill="#374151">• History keeps only what the caller heard</text>
</svg>