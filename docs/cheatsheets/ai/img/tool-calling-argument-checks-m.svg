<text x="62" y="1582" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1622" font-family="Chalkboard SE" font-size="21" fill="#374151">• Strict mode checks shape, not truth</text>
<text x="62" y="1662" font-family="Chalkboard SE" font-size="21" fill="#374151">• A well-formed id can still be the wrong</text>
<text x="77" y="1692" font-family="Chalkboard SE" font-size="21" fill="#374151">order</text>
<text x="62" y="1732" font-family="Chalkboard SE" font-size="21" fill="#374151">• Customer id comes from the session, not</text>
