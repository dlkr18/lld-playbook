<text x="62" y="1574" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1614" font-family="Chalkboard SE" font-size="21" fill="#374151">• Upsert returns when logged, not when</text>
<text x="77" y="1644" font-family="Chalkboard SE" font-size="21" fill="#374151">searchable</text>
<text x="62" y="1684" font-family="Chalkboard SE" font-size="21" fill="#374151">• Tests: poll fetch by id before asserting</text>
<text x="62" y="1724" font-family="Chalkboard SE" font-size="21" fill="#374151">• Storage is cheap; compute is paid per</text>
<text x="77" y="1754" font-family="Chalkboard SE" font-size="21" fill="#374151">query</text>
<text x="62" y="1794" font-family="Chalkboard SE" font-size="21" fill="#374151">• Cold namespace: first query is slower</text>
