<text x="56" y="630" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Result</text>
<rect x="82.0078125" y="214.0" width="435.984375" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">WHERE tenant_id = 42 · LIMIT 10</text>
<text x="300.0" y="284.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">tenant owns 1 in 800 rows</text>
<rect x="138.03125" y="424.0" width="323.9375" height="116" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="464.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">HNSW scan, then WHERE</text>
<text x="300.0" y="494.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">ef_search = 40 candidates</text>
<text x="300.0" y="524.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">from the whole table</text>
<rect x="129.0234375" y="664.0" width="341.953125" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="704.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">40 / 800 = 0.05 expected</text>
<text x="300.0" y="734.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">usually 0 rows, no error</text>
<rect x="165.53125" y="836.0" width="268.9375" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="876.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Iterative index scan</text>
<text x="300.0" y="906.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">keep pulling candidates</text>
<text x="300.0" y="936.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">until 10 rows pass</text>
<rect x="167.5390625" y="1038.0" width="264.921875" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="1078.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">10 rows</text>
<text x="300.0" y="1108.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">after ≈12,700 candidates</text>
<rect x="158.03125" y="1210.0" width="283.9375" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1250.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">B-tree on tenant_id</text>
<text x="300.0" y="1280.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">fetch only tenant 42's rows</text>
<text x="300.0" y="1310.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">exact distance on those</text>
<rect x="125.515625" y="1412.0" width="348.96875" height="86" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1452.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">10 rows, recall 100%</text>
<text x="300.0" y="1482.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">median tenant: 2,000 rows ≈12 MB</text>
<rect x="36" y="1538" width="528" height="288" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1582" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1622" font-family="Chalkboard SE" font-size="21" fill="#374151">• A role filter keeping 10%: ≈4 rows, not 10</text>
<text x="62" y="1662" font-family="Chalkboard SE" font-size="21" fill="#374151">• Largest tenants: a partial HNSW index</text>
<text x="77" y="1692" font-family="Chalkboard SE" font-size="21" fill="#374151">each</text>
<text x="62" y="1732" font-family="Chalkboard SE" font-size="21" fill="#374151">• Check the chosen plan with EXPLAIN, after</text>
<text x="77" y="1762" font-family="Chalkboard SE" font-size="21" fill="#374151">ANALYZE</text>
<text x="62" y="1802" font-family="Chalkboard SE" font-size="21" fill="#374151">• Raising ef_search cannot rescue 1 in 800</text>
