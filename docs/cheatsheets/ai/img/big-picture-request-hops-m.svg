<line x1="300.0" y1="1472.0" x2="300.0" y2="1552.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)"/>
<rect x="50" y="108" width="77.03125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="132" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Gather</text>
<rect x="50" y="894" width="66.03125" height="32" rx="6" fill="#ffffff"/>
<text x="56" y="918" font-family="Marker Felt" font-size="23" fill="#6b7280" font-weight="bold">Write</text>
<rect x="169.03125" y="166.0" width="261.9375" height="86" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="206.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Support question</text>
<text x="300.0" y="236.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">93 characters · 15 words</text>
<rect x="208.5546875" y="338.0" width="182.890625" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="378.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">1 · Tokenize</text>
<text x="300.0" y="408.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">17 token ids</text>
<rect x="157.9921875" y="510.0" width="284.015625" height="116" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="550.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">2 · Retrieve evidence</text>
<text x="300.0" y="580.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">embed · hybrid search</text>
<text x="300.0" y="610.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">rerank 30 → 5 chunks</text>
<rect x="164.015625" y="712.0" width="271.96875" height="116" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="752.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">3 · Assemble prompt</text>
<text x="300.0" y="782.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">≈3,500 tokens</text>
<text x="300.0" y="812.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">rules · 5 chunks · question</text>
<rect x="191.0234375" y="952.0" width="217.953125" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="992.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">4 · Prefill</text>
<text x="300.0" y="1022.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">all 3,500 in parallel</text>
<text x="300.0" y="1052.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">KV cache 437.5 MiB</text>
<rect x="187.015625" y="1154.0" width="225.96875" height="116" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/>
<text x="300.0" y="1194.0" font-family="Chalkboard SE" font-size="23" fill="#db2777" text-anchor="middle" font-weight="bold">5 · Pick a token</text>
<text x="300.0" y="1224.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">logits → softmax</text>
<text x="300.0" y="1254.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">T = 0.2: "Yes" 0.989</text>
<rect x="164.0" y="1356.0" width="272.0" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="1396.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">6 · Decode loop</text>
<text x="300.0" y="1426.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">250 tokens, one at a time</text>
<text x="300.0" y="1456.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">≈4.8 ms each on one H100</text>
<rect x="177.515625" y="1558.0" width="244.96875" height="116" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="300.0" y="1598.0" font-family="Chalkboard SE" font-size="23" fill="#16a34a" text-anchor="middle" font-weight="bold">8 · Check + trace</text>
<text x="300.0" y="1628.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">citations valid?</text>
<text x="300.0" y="1658.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">else to a human</text>
<rect x="36" y="1714" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="1758" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="1798" font-family="Chalkboard SE" font-size="21" fill="#374151">• First token ≈1.2 s, done ≈4.3 s, ≈$0.015</text>
<text x="62" y="1838" font-family="Chalkboard SE" font-size="21" fill="#374151">• Most time is decode: ≈3.1 s of output</text>
<text x="62" y="1878" font-family="Chalkboard SE" font-size="21" fill="#374151">• Most money: the answer model's tokens</text>
<text x="62" y="1918" font-family="Chalkboard SE" font-size="21" fill="#374151">• Retrieval ≈$0.0004, yet decides</text>
<text x="77" y="1948" font-family="Chalkboard SE" font-size="21" fill="#374151">correctness</text>
</svg>