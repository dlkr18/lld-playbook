<text x="300.0" y="254.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Employee</text>
<rect x="132.5234375" y="356.0" width="334.953125" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="396.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">API gateway</text>
<text x="300.0" y="426.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">auth · region · quotas · streaming</text>
<rect x="157.5078125" y="566.0" width="284.984375" height="86" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text x="300.0" y="606.0" font-family="Chalkboard SE" font-size="23" fill="#ea580c" text-anchor="middle" font-weight="bold">Router</text>
<text x="300.0" y="636.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">small model, one-word label</text>
<rect x="163.0234375" y="738.0" width="273.953125" height="86" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="300.0" y="778.0" font-family="Chalkboard SE" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="bold">Out of scope</text>
<text x="300.0" y="808.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">ask one clarifying question</text>
<rect x="174.5390625" y="948.0" width="250.921875" height="146" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
<text x="300.0" y="988.0" font-family="Chalkboard SE" font-size="23" fill="#7e22ce" text-anchor="middle" font-weight="bold">Policy Q&amp;A</text>
<text x="300.0" y="1018.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">retrieve with ACL filter</text>
<text x="300.0" y="1048.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">rerank</text>
<text x="300.0" y="1078.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">answer with citations</text>
<rect x="122.0390625" y="1180.0" width="355.921875" height="176" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="300.0" y="1220.0" font-family="Chalkboard SE" font-size="23" fill="#2563eb" text-anchor="middle" font-weight="bold">Report check (async)</text>
<text x="300.0" y="1250.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">queue → extract receipts in parallel</text>
<text x="300.0" y="1280.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">small model, batch API</text>
<text x="300.0" y="1310.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">code applies the rules</text>
<text x="300.0" y="1340.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">explain violations · notify</text>
<rect x="132.0234375" y="1442.0" width="335.953125" height="176" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="3"/>
<text x="300.0" y="1482.0" font-family="Chalkboard SE" font-size="23" fill="#db2777" text-anchor="middle" font-weight="bold">Claim fix (agent)</text>
<text x="300.0" y="1512.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">tools: read claims, propose change</text>
<text x="300.0" y="1542.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">step cap + token budget</text>
<text x="300.0" y="1572.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">user approves a summary</text>
<text x="300.0" y="1602.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">finance API: idempotent, audited</text>
<rect x="137.0078125" y="1742.0" width="325.984375" height="116" rx="14" fill="#f8fafc" stroke="#1f2937" stroke-width="3"/>
<text x="300.0" y="1782.0" font-family="Chalkboard SE" font-size="23" fill="#1f2937" text-anchor="middle" font-weight="bold">Model gateway</text>
<text x="300.0" y="1812.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">keys · retries · fallback provider</text>
<text x="300.0" y="1842.0" font-family="Chalkboard SE" font-size="19" fill="#374151" text-anchor="middle">cost per feature</text>
<rect x="162.0390625" y="1982.0" width="275.921875" height="56" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="300.0" y="2022.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Traces + release IDs</text>
<rect x="92.0" y="2124.0" width="180" height="56" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="182.0" y="2164.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Guardrails</text>
<rect x="328.0" y="2124.0" width="180" height="56" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="418.0" y="2164.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Caches</text>
<rect x="210.0" y="2266.0" width="180" height="56" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
<text x="300.0" y="2306.0" font-family="Chalkboard SE" font-size="23" fill="#0f766e" text-anchor="middle" font-weight="bold">Eval gates</text>
<rect x="36" y="2362" width="528" height="258" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="2406" font-family="Marker Felt" font-size="25" fill="#b45309" font-weight="bold">REMEMBER</text>
<text x="62" y="2446" font-family="Chalkboard SE" font-size="21" fill="#374151">• The model extracts, code decides</text>
<text x="62" y="2486" font-family="Chalkboard SE" font-size="21" fill="#374151">• Access control lives in the retrieval query</text>
<text x="62" y="2526" font-family="Chalkboard SE" font-size="21" fill="#374151">• The agent proposes; code executes after</text>
<text x="77" y="2556" font-family="Chalkboard SE" font-size="21" fill="#374151">approval</text>
<text x="62" y="2596" font-family="Chalkboard SE" font-size="21" fill="#374151">• About $82 a day for 10,000 employees</text>
</svg>